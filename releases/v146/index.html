t:800;min-height:45px}#utIosScanModes button[aria-pressed="true"]{background:#fff;color:#123d66;border-color:#fff}#scanShell.ut-ios.ut-barcode-mode .nativeScanFrame{left:7%;right:7%;top:32%;height:30%;max-height:none;aspect-ratio:auto}#scanShell.ut-ios.ut-barcode-mode #utQrPhotoButton{display:none}#scanShell .nativeScanStage{position:relative;min-height:0;flex:1;overflow:hidden;background:#000}#scanShell .nativeScanStage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#scanShell .nativeScanFrame{position:absolute;left:7%;right:7%;top:32%;height:30%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.30);overflow:hidden;pointer-events:none}#scanShell .nativeScanLaser{position:absolute;left:3%;right:3%;top:8%;height:2px;background:#ff1738;box-shadow:0 0 2px rgba(255,23,56,.55);animation:utV120SharpSweep 1.65s ease-in-out infinite alternate}@keyframes utV120SharpSweep{0%{top:8%}100%{top:90%}}</style></head><body data-unused=""><iframe id="frame" title="UniTrack 로그인 및 관리 화면" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" loading="eager"></iframe><div id="scanShell"><div class="nativeScanStage"><video id="nativeScanVideo" autoplay muted playsinline></video><div class="nativeScanFrame"><span class="nativeScanLaser"></span></div></div><div class="scanActions"><div id="utIosScanModes" role="group" aria-label="아이폰 스캔 종류"><button type="button" id="utIosQrMode" aria-pressed="true">QR코드</button><button type="button" id="utIosBarcodeMode" aria-pressed="false">일반 바코드</button></div><p id="nativeScanText">카메라를 준비하는 중...</p><button id="nativeScanClose" type="button">닫기</button><button id="utQrPhotoButton" type="button">사진에서 QR 읽기</button><input id="utQrPhotoInput" type="file" accept="image/*" style="display:none"></div></div><script id="utManualReleaseHost">
(function(){
'use strict';
const PAGE='V146', PIN_KEY='utManualPinnedReleaseV145', OLD_KEY='utSelectedExecUrlV130';
const frame=document.getElementById('frame');
const norm=u=>String(u||'').trim().split('?')[0].replace(/\/$/,'');
const valid=u=>/^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(norm(u));
let server='',current='',latest=null,verification=null,requestInProgress=false;
let pendingCheck=null,failures=0,goodStatus=null,lastCheck=0,requestSeq=0;
function deliver(type,payload,target){const data=Object.assign({type},payload||{});try{if(target)target.postMessage(data,'*')}catch(_){};try{if(frame.contentWindow!==target)frame.contentWindow.postMessage(data,'*')}catch(_){}}
async function json(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('배포 설정 읽기 실패');return r.json()}
async function latestInfo(){const m=await json('../../latest-deployment.json');if(!/^V\d+$/.test(m.version||'')||!valid(m.execUrl))throw Error('새 배포 주소 설정이 필요합니다');return m}
function getServerVersion(url){return new Promise(done=>{if(!valid(url))return done(null);const script=document.createElement('script');let ended=false;const finish=v=>{if(ended)return;ended=true;clearTimeout(t);script.remove();if(window.utV101VersionResult===callback)delete window.utV101VersionResult;done(v&&/^V\d+$/.test(v.version||'')?v.version:null)};const callback=v=>finish(v);window.utV101VersionResult=callback;const t=setTimeout(()=>finish(null),9000);script.onerror=()=>finish(null);script.src=url+'?action=unitrackVersion&_='+Date.now();document.head.append(script)})}
// V146 patch: dual-path server version check. JSONP first, isolated HTML proof second.
let proofJob=null;
function versionFromAppFrame(url){
 if(proofJob && proofJob.url===url)return proofJob.promise;
 const job={url,done:false,frame:document.createElement('iframe')};
 job.frame.setAttribute('aria-hidden','true');job.frame.tabIndex=-1;
 job.frame.style.cssText='position:fixed;left:-2px;top:-2px;width:1px;height:1px;opacity:0;pointer-events:none;border:0';
 job.promise=new Promise(resolve=>{
  const finish=v=>{if(job.done)return;job.done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);job.frame.remove();if(proofJob===job)proofJob=null;resolve(v)};
  const onMessage=e=>{const d=e.data||{};if(d.type!=='UNITRACK_VERSION_PROOF'||!/^V\d+$/.test(d.version||''))return;
   const trusted=e.source===job.frame.contentWindow||/^https:\/\/(?:[a-z0-9-]+\.)*(?:googleusercontent\.com|google\.com)$/i.test(e.origin||'');
   if(trusted)finish(d.version);
  };
  window.addEventListener('message',onMessage);
  const timer=setTimeout(()=>finish(null),14000);
  job.frame.addEventListener('load',()=>{try{job.frame.contentWindow.postMessage({type:'UNITRACK_VERSION_PROBE'},'*')}catch(_){}}, {once:true});
  job.frame.src=url+'?ut_version_probe='+Date.now();
  document.body.appendChild(job.frame);
 });proofJob=job;return job.promise;
}
const originalGetServerVersion=getServerVersion;
async function getVerifiedServerVersion(url){
 const v=await originalGetServerVersion(url);
 if(v)return v;
 return await versionFromAppFrame(url);
}
function sendStatus(target){deliver('UNITRACK_MANUAL_STATUS',verification||{checked:false,ok:false},target);deliver('UNITRACK_VERSION_INFO',{execUrl:current,latestExecUrl:latest&&latest.execUrl||'',latestVersion:latest&&latest.version||''},target)}
async function check(target,force=false){
 if(pendingCheck){await pendingCheck;sendStatus(target);return}
 if(!force && verification && Date.now()-lastCheck<45000){sendStatus(target);return}
 const seq=++requestSeq;
 pendingCheck=(async()=>{
  let m=null,sv=null;
  try{m=await latestInfo();sv=await getVerifiedServerVersion(current);if(!sv)throw Error('server version unavailable');
   if(seq!==requestSeq)return;
   latest=m;failures=0;lastCheck=Date.now();
   goodStatus={checked:true,ok:PAGE===m.version&&current===norm(m.execUrl)&&sv===PAGE,
    reason:'mismatch',githubVersion:PAGE,latestVersion:m.version,execUrl:current,serverVersion:sv};
   verification=goodStatus;
  }catch(_){
   if(seq!==requestSeq)return;
   failures++;lastCheck=Date.now();
   if(failures>=3){verification=Object.assign({},goodStatus||{githubVersion:PAGE},
      {checked:true,ok:false,reason:'version_check_failed',consecutiveFailures:failures});}
   else if(goodStatus){verification=goodStatus;}
   else{verification={checked:false,ok:false,reason:'checking',githubVersion:PAGE};}
  }
 })();
 try{await pendingCheck}finally{pendingCheck=null}
 sendStatus(target);
}
async function init(){try{const own=await json('./release.json');if(own.version!==PAGE||!valid(own.execUrl))throw Error('릴리스 설정 오류');server=norm(own.execUrl);current=server;try{localStorage.setItem(PIN_KEY,PAGE)}catch(_){};frame.src=server+'?release='+PAGE+'&t='+Date.now();frame.addEventListener('load',()=>{deliver('UNITRACK_EXEC_URL',{url:current});sendStatus()}, {once:true});await check()}catch(e){document.getElementById('manualSetupError').hidden=false;document.getElementById('manualSetupError').textContent='릴리스 설정을 확인해 주세요: '+e.message}}

function utV146Overlay(){let b=document.getElementById('utV146RetryOverlay');if(!b){b=document.createElement('div');b.id='utV146RetryOverlay';b.setAttribute('role','status');b.style.cssText='position:fixed;inset:0;z-index:95;background:rgba(8,20,39,.64);display:flex;justify-content:center;align-items:center;padding:20px;font-family:system-ui,sans-serif';b.innerHTML='<div style="width:min(360px,94vw);padding:24px;background:white;color:#1e293b;border-radius:15px;box-shadow:0 10px 35px #0005;text-align:center"><div style="width:34px;height:34px;border:4px solid #dbeafe;border-top-color:#12659f;border-radius:50%;margin:0 auto 14px;animation:utV146Spin .7s linear infinite"></div><strong id="utV146RetryTitle">최신버전 적용중...</strong><p id="utV146RetrySub" style="font-size:14px;color:#64748b;margin-bottom:0">서버 버전 검증 1 / 5</p></div>';const style=document.createElement('style');style.textContent='@keyframes utV146Spin{to{transform:rotate(360deg)}}';document.head.appendChild(style);document.body.appendChild(b)}return b}
function utV146Progress(n,recipient){const b=utV146Overlay();b.querySelector('#utV146RetrySub').textContent='서버 버전 검증 '+n+' / 5';deliver('UNITRACK_APPLY_LATEST_PROGRESS',{attempt:n,maxAttempts:5},recipient)}
function utV146Dismiss(){document.getElementById('utV146RetryOverlay')?.remove()}
function utV146Delay(ms){return new Promise(r=>setTimeout(r,ms))}
async function utV146VerifyFive(url,expected,recipient){let received=null;for(let n=1;n<=5;n++){utV146Progress(n,recipient);received=await getVerifiedServerVersion(url);if(received===expected)return {ok:true,found:received};if(received&&received!==expected)return {ok:false,found:received};if(n<5)await utV146Delay(350*n)}return {ok:false,found:received}}

window.addEventListener('message',async e=>{const d=e.data||{};const trusted=e.source===frame.contentWindow||/^https:\/\/(?:[a-z0-9-]+\.)*(?:googleusercontent\.com|google\.com)$/i.test(e.origin||'');if(!trusted)return;
if(d.type==='UNITRACK_VERSION_GET'){await check(e.source)}
if(d.type==='UNITRACK_VERSION_APPLY'){const u=norm(d.execUrl);if(u===current){deliver('UNITRACK_VERSION_UNCHANGED',{execUrl:current},e.source);return}if(!valid(u)){deliver('UNITRACK_VERSION_ERROR',{message:'올바른 /exec 주소가 아닙니다'},e.source);return} // Explicit rollback by URL: navigate only after validating the server; do not silently replace pinned release.
const v=await getVerifiedServerVersion(u);if(!v){deliver('UNITRACK_VERSION_ERROR',{message:'서버 버전을 확인하지 못해 기존 버전을 유지합니다'},e.source);return}if(v===PAGE){deliver('UNITRACK_VERSION_ACCEPTED',{execUrl:u},e.source);current=u;frame.src=u+'?manual='+Date.now();await check(e.source)}else{deliver('UNITRACK_VERSION_ERROR',{message:'이 주소는 '+v+'입니다. 해당 버전의 보존된 GitHub 릴리스를 선택해야 안전하게 전환됩니다.'},e.source)}return}
if(d.type==='UNITRACK_APPLY_LATEST'){if(requestInProgress)return;requestInProgress=true;let success=false;try{const m=await latestInfo();const checkResult=await utV146VerifyFive(m.execUrl,m.version,e.source);if(!checkResult.ok){deliver('UNITRACK_APPLY_LATEST_RESULT',{ok:false,message:'새 서버 버전 검증 실패 ('+(checkResult.found||'5회 응답 없음')+'). 기존 버전을 유지합니다.'},e.source);return}const head=await fetch('../../releases/'+m.version.toLowerCase()+'/release.json?t='+Date.now(),{cache:'no-store'});if(!head.ok)throw Error('신규 버전 파일이 없습니다');const frozen=await head.json();if(frozen.version!==m.version||norm(frozen.execUrl)!==norm(m.execUrl))throw Error('신규 버전 파일과 배포 주소가 일치하지 않습니다');try{localStorage.setItem(PIN_KEY,m.version);localStorage.removeItem(OLD_KEY)}catch(_){}success=true;deliver('UNITRACK_APPLY_LATEST_RESULT',{ok:true,execUrl:m.execUrl},e.source);setTimeout(()=>location.replace('../../index.html?manual_apply='+Date.now()),350)}catch(err){deliver('UNITRACK_APPLY_LATEST_RESULT',{ok:false,message:String(err.message||err)},e.source)}finally{requestInProgress=false;if(!success)utV146Dismiss()}}
});

window.addEventListener('focus',()=>check(null,true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(null,true)});setInterval(()=>{if(!document.hidden)check(null,true)},300000);init();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
 'use strict';
 const shell=document.getElementById('scanShell');
 const video=document.getElementById('nativeScanVideo');
 const msg=document.getElementById('nativeScanText');
 const appFrame=document.getElementById('frame');
 let stream=null,nativeTimer=0,quaggaTimer=0,qrTimer=0,detector=null,zxingReader=null,requestId='',requester=null,done=false,busy=false,quaggaBusy=false,generation=0,scanMode='qr';
 const APP_URL=location.href; // native scanner uses postMessage bridge
 const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(isIOS)shell.classList.add('ut-ios');
 const qrButton=document.getElementById('utIosQrMode');
 const barcodeButton=document.getElementById('utIosBarcodeMode');
 function syncScanMode(){
   shell.classList.toggle('ut-barcode-mode',isIOS&&scanMode==='barcode');
   qrButton.setAttribute('aria-pressed',String(scanMode==='qr'));
   barcodeButton.setAttribute('aria-pressed',String(scanMode==='barcode'));
 }
 qrButton.addEventListener('click',()=>{if(isIOS&&scanMode!=='qr'&&shell.classList.contains('active'))start(requestId,requester,'qr')});
 barcodeButton.addEventListener('click',()=>{if(isIOS&&scanMode!=='barcode'&&shell.classList.contains('active'))start(requestId,requester,'barcode')});
 const qrCanvas=document.createElement('canvas');
 const qrCtx=qrCanvas.getContext('2d',{willReadFrequently:true});
 let qrBusy=false;
 function stop(){
   generation++;clearInterval(nativeTimer);clearInterval(quaggaTimer);clearInterval(qrTimer);
   nativeTimer=0;quaggaTimer=0;qrTimer=0;busy=false;quaggaBusy=false;qrBusy=false;
   try{zxingReader&&zxingReader.reset()}catch(_){} zxingReader=null;
   try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}
   stream=null;video.srcObject=null;shell.classList.remove('active');
 }
 function deliver(v){
   const value=String(v||'').trim();
   if(!value||done)return;
   done=true;msg.textContent='인식 완료: '+value;
   try{navigator.vibrate&&navigator.vibrate([100,50,100])}catch(_){}
   const payload={type:'UNITRACK_SCAN_RESULT',value,requestId};
   // Respond to both the requester and the current app iframe. Repeat after teardown.
   const send=()=>{
     try{requester&&requester.postMessage(payload,'*')}catch(_){}
     try{appFrame.contentWindow&&appFrame.contentWindow.postMessage(payload,'*')}catch(_){}
   };
   send();setTimeout(send,150);setTimeout(()=>{stop();send()},300);
 }
 async function start(id,source,mode){
   stop();scanMode=isIOS?(mode==='barcode'?'barcode':'qr'):'auto';syncScanMode();requestId=id;requester=source;done=false;
   const ticket=generation;shell.classList.add('active');msg.textContent='카메라 준비 중...';
   try{
     stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false});
     if(ticket!==generation){stream.getTracks().forEach(t=>t.stop());return;}
     const track=stream.getVideoTracks()[0];
     try{const caps=track.getCapabilities?.()||{};if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
     video.srcObject=stream;await video.play();
     msg.textContent=isIOS?(scanMode==='qr'?'QR코드를 정사각형 안에 맞춰 주세요':'일반 바코드를 가로 프레임 안에 맞춰 주세요'):'바코드 또는 QR코드를 네모 안에 맞춰 주세요';
     if('BarcodeDetector' in window){
       try{const formats=await BarcodeDetector.getSupportedFormats();const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];const chosen=isIOS?(scanMode==='qr'?['qr_code']:wanted.filter(f=>f!=='qr_code'&&f!=='data_matrix')):wanted;const use=chosen.filter(x=>formats.includes(x));if(use.length)detector=new BarcodeDetector({formats:use});else if(!isIOS)detector=new BarcodeDetector()}catch(_){try{detector=new BarcodeDetector()}catch(__){}}
       if(detector)nativeTimer=setInterval(async()=>{
         if(done||busy||!stream||video.readyState<2)return;
         busy=true;
         try{const found=await detector.detect(video);const hit=found&&found.find(x=>x&&x.rawValue);if(hit)deliver(hit.rawValue)}catch(_){}finally{busy=false}
       },110);
     }
     // V100 stable fallback: Quagga2 decodeSingle on cropped camera frames, not ZXing.
     if(window.Quagga && (!isIOS || scanMode==='barcode')){
       const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
       quaggaTimer=setInterval(()=>{
         if(done||quaggaBusy||!stream||video.readyState<2)return;
         const vw=video.videoWidth,vh=video.videoHeight;
         if(!vw||!vh)return;
         quaggaBusy=true;
         try{
           const cw=Math.max(1,Math.round(vw*.94)),ch=Math.max(1,Math.round(vh*.34));
           const decodeWidth=isIOS?960:1280;
           c.width=decodeWidth;c.height=Math.max(isIOS?270:360,Math.round(decodeWidth*ch/cw));
           ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
           Quagga.decodeSingle({
             src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
             inputStream:{size:isIOS?960:1280,singleChannel:false},
             decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
             locator:{patchSize:'medium',halfSample:false}
           },res=>{quaggaBusy=false;const value=res&&res.codeResult&&res.codeResult.code;if(value)deliver(value)});
         }catch(_){quaggaBusy=false}
       },isIOS?400:260);
     }
     // iPhone: scan camera image pixels using an independent QR decoder (jsQR).
     // This avoids depending on BarcodeDetector support or ZXing video callback timing.
     if(isIOS && scanMode==='qr' && typeof window.jsQR==='function' && qrCtx){
       qrTimer=setInterval(()=>{
         if(done||qrBusy||ticket!==generation||!stream||video.readyState<2)return;
         const w=video.videoWidth,h=video.videoHeight;
         if(!w||!h)return;
         qrBusy=true;
         try{
           const side=Math.min(w,h), sx=(w-side)/2, sy=(h-side)/2;
           // Inspect a central square for QR; decode mirrored/normal camera as supplied.
           const target=Math.min(960,side);
           qrCanvas.width=target;qrCanvas.height=target;
           qrCtx.drawImage(video,sx,sy,side,side,0,0,target,target);
           const pixels=qrCtx.getImageData(0,0,target,target);
           const result=window.jsQR(pixels.data,target,target,{inversionAttempts:'attemptBoth'});
           if(result && result.data)deliver(result.data);
         }catch(_){}finally{qrBusy=false}
       },260);
     }

     // Keep native BarcodeDetector and the known-good Quagga 1D pipeline unchanged.

       try{
         const hints=new Map();
         if(ZXing.DecodeHintType){
           hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
           if(ZXing.BarcodeFormat)
             hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE]);
         }
         // QR-specific reader uses fewer formats and runs continuously on the existing stream.
         const QRReader=ZXing.BrowserQRCodeReader||ZXing.BrowserMultiFormatReader;
         const reader=new QRReader(hints,200);
         zxingReader=reader;
         reader.decodeFromVideoElement(video,(result)=>{
           if(done||ticket!==generation||!result)return;
           const value=typeof result.getText==='function'?result.getText():result.text;
           if(value)deliver(value);
         }).catch(()=>{});
       }catch(_){}
     }
     // iOS barcode mode fallback only when the established Quagga2 decoder is unavailable.
     if(isIOS && scanMode==='barcode' && !window.Quagga && window.ZXing && ZXing.BrowserMultiFormatReader){
       try{
         const hints=new Map();
         if(ZXing.DecodeHintType && ZXing.BarcodeFormat){
           hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
           hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,['CODE_128','CODE_39','CODE_93','EAN_13','EAN_8','UPC_A','UPC_E','ITF','CODABAR'].map(x=>ZXing.BarcodeFormat[x]).filter(x=>x!==undefined));
         }
         const reader=new ZXing.BrowserMultiFormatReader(hints,350);zxingReader=reader;
         reader.decodeFromVideoElement(video,(result)=>{if(done||ticket!==generation||!result)return;const val=typeof result.getText==='function'?result.getText():result.text;if(val)deliver(val)}).catch(()=>{});
       }catch(_){}

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b9b"><title>UniTrack</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"></head>
<body style="margin:0;background:#f3f6fa">
<script>
(function(){
  'use strict';
  const KEY='utManualPinnedReleaseV145';
  let selected='V147';
  try {const saved=localStorage.getItem(KEY);if(/^V\d+$/.test(saved||''))selected=saved;}catch(_){}
  // The version page itself checks release.json and has its own safe fallback.
  const target='./releases/'+selected.toLowerCase()+'/index.html';
  location.replace(target);
})();
</script>
<noscript>UniTrack을 실행하려면 JavaScript를 켜주세요.</noscript>
</body></html>

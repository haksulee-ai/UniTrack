<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b9b"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>UniTrack</title><style>body{margin:0;padding:32px;font:16px system-ui;background:#f3f6fa;color:#223}p{line-height:1.6}button{background:#075b9b;color:white;border:0;border-radius:9px;padding:12px}</style></head><body><h2>UniTrack</h2><p id="msg">선택한 버전을 여는 중입니다…</p><button id="reset" hidden>V144 안전 버전 열기</button><script>(async()=>{const KEY='utManualPinnedReleaseV145',VALID=/^V\d+$/;let selected='V144';try{const saved=localStorage.getItem(KEY);if(VALID.test(saved||''))selected=saved;else localStorage.setItem(KEY,selected)}catch(_){};const fallback=()=>{document.getElementById('msg').textContent='선택한 버전 화면을 열 수 없습니다. V144 안전 버전을 선택할 수 있습니다.';document.getElementById('reset').hidden=false};document.getElementById('reset').onclick=()=>{localStorage.setItem(KEY,'V144');location.replace('./releases/v144/index.html')};try{const r=await fetch('./releases/'+selected.toLowerCase()+'/release.json?b='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not found');const cfg=await r.json();if(cfg.version!==selected||!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(cfg.execUrl))throw Error('bad config');location.replace('./releases/'+selected.toLowerCase()+'/index.html')}catch(_){fallback()}})();</script></body></html>

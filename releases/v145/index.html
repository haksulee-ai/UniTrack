<script>
(function(){

   generation++;clearInterval(nativeTimer);clearInterval(quaggaTimer);

   try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}

   const value=String(v||'').trim();

   try{navigator.vibrate&&navigator.vibrate([100,50,100])}catch(_){}

   const send=()=>{
     try{requester&&requester.postMessage(payload,'*')}catch(_){}

   };

   try{

   }catch(e){msg.textContent='카메라 연결 실패: 권한 및 브라우저 설정을 확인해 주세요.';try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}stream=null}

})();

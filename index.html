<body>
<div id="setup">
 <div class="card">
  <img class="logo" src="./icon-512.png" alt="UniTrack">
  <h1>UniTrack</h1>
  <p>Apps Script 배포 URL을 한 번만 입력하세요.<br>이후 홈 화면의 UniTrack 아이콘으로 바로 실행됩니다.</p>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/...../exec">
  <button onclick="saveAndOpen()">UniTrack 연결</button>
  <p class="small">배포 URL은 이 기기에만 저장됩니다.</p>
 </div>
</div>
<button id="userBtn" type="button" onclick="openUtUser()">👤</button><div id="utUserOverlay"><div id="utUserCard"><h3>UniTrack 사용자 등록</h3><p>이 기기에서 작업할 이름을 선택하세요.</p><div id="utUserList"><div style="padding:10px;color:#777">사용자 목록 불러오는 중…</div></div><div id="utUserManual"><input id="utUserInput" type="text" placeholder="이름 직접 입력"><button type="button" onclick="saveUtUser(document.getElementById('utUserInput').value)">등록</button></div></div></div><button id="notifyBtn" type="button" onclick="enableNotifications()" title="알림 설정">🔔</button>
<button id="changeUrl" type="button" onclick="changeConnection()">연결 주소 변경</button>
<div id="pwaScanner">
  <video id="pwaScanVideo" playsinline autoplay muted></video>
  <div id="pwaScanShade"></div>
  <div id="pwaFocusBox"><div id="pwaLaser"></div></div>
  <div id="pwaScanGuide">바코드 / QR 코드를 네모 안에 맞춰주세요</div>
  <button id="pwaScanClose" type="button" onclick="closePwaScanner()">×</button>
</div>
<iframe id="app" allow="camera *; microphone *; clipboard-read *; clipboard-write *" allowfullscreen></iframe>
<script>
const KEY='unitrack_apps_script_url';
const DEFAULT_APP_URL='https://script.google.com/macros/s/AKfycby94pRfhnMGDxpsgcbzexB7-HjPHKGAmhZkg7MnQFTot7CGCXUSP-LIi-kRDUSwfOCv/exec';
function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test((u||'').trim())}
function withDeviceUser(u){try{const n=(localStorage.getItem('unitrack_device_user_v1')||'').trim();if(!n)return u;const x=new URL(u);x.searchParams.set('deviceUser',n);return x.toString()}catch(_){return u}}
function openApp(u){
 const setup=document.getElementById('setup');
 setup.style.display='none';
 setup.style.pointerEvents='none';
 document.getElementById('changeUrl').style.display='block';
 document.getElementById('notifyBtn').style.display='block';
 setTimeout(placeNotifyButton,0);
 const f=document.getElementById('app');
 f.style.display='block';
 f.style.pointerEvents='auto';
 f.style.touchAction='auto';
 f.src=u;
}
function changeConnection(){const current=localStorage.getItem(KEY)||DEFAULT_APP_URL;const u=prompt('Apps Script 웹앱 /exec 연결주소를 입력하세요.',current);if(u===null)return;const v=String(u).trim();if(!valid(v)){alert('Apps Script 웹앱 /exec 주소를 확인해주세요.');return}try{localStorage.setItem(KEY,v)}catch(_){}openApp(withDeviceUser(v));}
function saveAndOpen(){
 const u=document.getElementById('url').value.trim();
 if(!valid(u)){alert('Apps Script 웹앱 /exec 주소를 입력해주세요.');return}
 localStorage.setItem(KEY,u);openApp(u);
}
let saved='';
try{saved=localStorage.getItem(KEY)||''}catch(_){}
if(!valid(saved)){saved=DEFAULT_APP_URL;try{localStorage.setItem(KEY,saved)}catch(_){}}
openApp(withDeviceUser(saved));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
<script>


function placeNotifyButton(){
  const b=document.getElementById('notifyBtn'), c=document.getElementById('changeUrl');
  if(!b||!c||getComputedStyle(c).display==='none')return;
  // Let the existing responsive CSS determine the connection button's horizontal position.
  // Use its rendered center as the shared vertical center.
  b.style.setProperty('right','auto','important');
  b.style.setProperty('bottom','auto','important');
  const r=c.getBoundingClientRect();
  const cy=r.top+r.height/2;
  b.style.setProperty('left',Math.max(8,r.left-b.offsetWidth-8)+'px','important');
  b.style.setProperty('top',(cy-b.offsetHeight/2)+'px','important');
  c.style.setProperty('top',(cy-c.offsetHeight/2)+'px','important');
}
window.addEventListener('resize',placeNotifyButton);
window.addEventListener('orientationchange',()=>setTimeout(placeNotifyButton,150));
setTimeout(placeNotifyButton,250);

async function enableNotifications(){
  if(!('Notification' in window)){alert('이 기기/브라우저는 웹 알림을 지원하지 않습니다.');return}
  let p=Notification.permission;
  if(p!=='granted') p=await Notification.requestPermission();
  if(p!=='granted'){alert('UniTrack 알림 권한이 허용되지 않았습니다.');return}
  localStorage.setItem('unitrack_notify_enabled','1');
  const reg=await navigator.serviceWorker.ready;
  await reg.showNotification('UniTrack 알림 테스트',{
    body:'알림 연결 완료 · 통합시트 기록 시 알림을 표시합니다.',
    icon:'./icon-192.png',badge:'./icon-192.png',tag:'unitrack-test',renotify:true
  });
}
let lastMovementNoticeKey='',lastMovementNoticeAt=0;
async function showMovementNotification(d){
  if(localStorage.getItem('unitrack_notify_enabled')!=='1')return;
  const noticeKey=[d.savedAt||'',d.barcode||'',d.serial||'',d.toStatus||''].join('|');
  const now=Date.now();
  if(noticeKey && noticeKey===lastMovementNoticeKey && now-lastMovementNoticeAt<2500)return;
  lastMovementNoticeKey=noticeKey; lastMovementNoticeAt=now;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const unit=String(d.unit||'-');
  const fromStatus=String(d.fromStatus||'').trim();
  const toStatus=String(d.toStatus||'통합시트 기록').trim();
  const statusText=(fromStatus && fromStatus!==toStatus) ? (fromStatus+' → '+toStatus) : toStatus;
  const barcode=String(d.barcode||'-');
  const serial=String(d.serial||'-');
  const savedAt=String(d.savedAt||new Date().toLocaleString('ko-KR'));
  const name=String(d.name||'-');
  const body=[
    'Unit : '+unit,
    '변경상태 : '+statusText,
    'SKT바코드 : '+barcode,
    'Serial No. : '+serial,
    '날짜/시간 : '+savedAt,
    '처리자 : '+name
  ].join('\n');
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('UniTrack 유동기록',{
      body:body,icon:'./icon-192.png',badge:'./icon-192.png',
      tag:'unitrack-v4-movement-'+Date.now(),renotify:true,data:{url:location.href}
    });
    if(navigator.vibrate)navigator.vibrate([100,50,100]);
  }catch(_){}
}
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.type==='UNITRACK_MOVEMENT_SAVED') showMovementNotification(d);
});

</script>

<script>
let pwaScanStream=null,pwaScanTimer=null,pwaScanBusy=false,pwaScanRequester=null,pwaScanRequestId='',pwaScanPort=null,pwaQuaggaTimer=null,pwaDone=false;

function sendPwaScanResult(value){
  value=String(value||'').trim();
  if(!value||pwaDone)return;
  pwaDone=true;
  try{if(navigator.vibrate)navigator.vibrate([120,55,120])}catch(_){}
  const id=pwaScanRequestId;
  // Primary v7.14.38 bridge: GET image beacon to the same Apps Script /exec.
  // Apps Script iframe polls CacheService for this requestId.
  try{
    const base=(localStorage.getItem(KEY)||'').split('?')[0];
    if(base&&id){
      const img=new Image();
      img.style.display='none';
      img.src=base+'?action=scanResult&id='+encodeURIComponent(id)+'&value='+encodeURIComponent(value)+'&_='+Date.now();
      document.body.appendChild(img);
      setTimeout(()=>{try{img.remove()}catch(_){}},4000);

      // Hidden GET navigation reliably executes Apps Script doGet even if an image MIME redirect is rejected.
      let sink=document.getElementById('unitrackScanSink');
      if(!sink){
        sink=document.createElement('iframe');
        sink.id='unitrackScanSink';sink.name='unitrackScanSink';
        sink.style.display='none';document.body.appendChild(sink);
      }
      const form=document.createElement('form');
      form.method='GET';form.action=base;form.target='unitrackScanSink';form.style.display='none';
      [['action','scanResult'],['id',id],['value',value],['_',String(Date.now())]].forEach(function(pair){
        const inp=document.createElement('input');inp.type='hidden';inp.name=pair[0];inp.value=pair[1];form.appendChild(inp);
      });
      document.body.appendChild(form);form.submit();
      setTimeout(()=>{try{form.remove()}catch(_){}},1000);
    }
  }catch(_){}
  // Keep previous direct channels as secondary fallbacks.
  const payload={type:'UNITRACK_SCAN_RESULT',value,requestId:id};
  // Direct return paths first.
  try{if(pwaScanPort){pwaScanPort.postMessage(payload);pwaScanPort.close()}}catch(_){}
  try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
  // Google can wrap the Apps Script iframe. Broadcast to every iframe we can reach.
  try{
    document.querySelectorAll('iframe').forEach(function(fr){
      try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
    });
  }catch(_){}
  // Repeat after the camera closes; this avoids losing the message during video teardown.
  setTimeout(function(){
    try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
    try{
      document.querySelectorAll('iframe').forEach(function(fr){
        try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
      });
    }catch(_){}
    closePwaScanner();
  },180);
}

async function openPwaScanner(){
  if(pwaScanBusy)return;
  pwaScanBusy=true;pwaDone=false;
  const box=document.getElementById('pwaScanner'),video=document.getElementById('pwaScanVideo');
  box.classList.add('active');
  try{
    pwaScanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},
      audio:false
    });
    try{
      const tr=pwaScanStream.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
      if(caps.focusMode&&Array.from(caps.focusMode).includes('continuous'))
        await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(_){}
    video.srcObject=pwaScanStream;
    await video.play();

    // Native detector: fast QR + common 1D.
    if('BarcodeDetector' in window){
      let formats=[];try{formats=await BarcodeDetector.getSupportedFormats()}catch(_){}
      const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
      const use=wanted.filter(x=>formats.includes(x));
      const detector=use.length?new BarcodeDetector({formats:use}):new BarcodeDetector();
      let detecting=false;
      pwaScanTimer=setInterval(async()=>{
        if(pwaDone||detecting||!pwaScanStream||video.readyState<2)return;
        detecting=true;
        try{
          const rs=await detector.detect(video);
          const hit=rs&&rs.find(x=>x&&x.rawValue);
          if(hit)sendPwaScanResult(hit.rawValue);
        }catch(_){}
        detecting=false;
      },110);
    }

    // Quagga2 in parallel for difficult 1D warehouse barcodes.
    if(window.Quagga){
      let qbusy=false;
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
      pwaQuaggaTimer=setInterval(()=>{
        if(pwaDone||qbusy||!pwaScanStream||video.readyState<2)return;
        qbusy=true;
        try{
          const vw=video.videoWidth,vh=video.videoHeight,cw=Math.round(vw*.94),ch=Math.round(vh*.34);
          c.width=1280;c.height=Math.max(360,Math.round(1280*ch/cw));
          ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
          Quagga.decodeSingle({
            src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
            inputStream:{size:1280,singleChannel:false},
            decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
            locator:{patchSize:'medium',halfSample:false}
          },r=>{qbusy=false;const v=r&&r.codeResult&&r.codeResult.code;if(v)sendPwaScanResult(v)});
        }catch(_){qbusy=false}
      },260);
    }
  }catch(e){
    closePwaScanner();
    const fb={type:'UNITRACK_SCAN_FALLBACK',requestId:pwaScanRequestId};
    try{pwaScanRequester&&pwaScanRequester.postMessage(fb,'*')}catch(_){}
  }finally{pwaScanBusy=false}
}
function closePwaScanner(){
  if(pwaScanTimer){clearInterval(pwaScanTimer);pwaScanTimer=null}
  if(pwaQuaggaTimer){clearInterval(pwaQuaggaTimer);pwaQuaggaTimer=null}
  if(pwaScanStream){pwaScanStream.getTracks().forEach(t=>t.stop());pwaScanStream=null}
  const v=document.getElementById('pwaScanVideo');if(v)v.srcObject=null;
  const box=document.getElementById('pwaScanner');if(box)box.classList.remove('active');
  pwaScanPort=null;pwaScanRequester=null;
}
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='UNITRACK_SCAN_REQUEST'){
    pwaScanRequester=ev.source;
    pwaScanRequestId=d.requestId||'';
    pwaScanPort=(ev.ports&&ev.ports[0])||null;
    try{pwaScanPort&&pwaScanPort.start&&pwaScanPort.start()}catch(_){}
    openPwaScanner();
  }
});
</script>

<script id="unitrack-pwa-scan-feedback-v71437">
(function(){
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    var t=String(d.type||'').toUpperCase();
    if((t.indexOf('SCAN')>=0 && (d.value||d.code||d.text||d.result))){
      try{ if(navigator.vibrate) navigator.vibrate([110,55,110]); }catch(_){}
    }
  },true);
})();
</script>
<script>
const UT_USER_KEY='unitrack_device_user_v1';let utNames=[];
function utUser(){try{return(localStorage.getItem(UT_USER_KEY)||'').trim()}catch(_){return''}}
function placeUtUser(){const b=document.getElementById('userBtn'),n=document.getElementById('notifyBtn');if(!b||!n)return;const r=n.getBoundingClientRect(),w=36,g=7;b.style.left=(r.right+g)+'px';b.style.top=(r.top+(r.height-w)/2)+'px';b.style.right='auto';b.style.display='block'}
function sendUtUser(){const f=document.getElementById('app');if(f&&f.contentWindow)try{f.contentWindow.postMessage({type:'UNITRACK_DEVICE_USER',name:utUser()},'*')}catch(_){}}
function reqUtNames(){const f=document.getElementById('app');if(f&&f.contentWindow)try{f.contentWindow.postMessage({type:'UNITRACK_REQUEST_NAME_OPTIONS'},'*')}catch(_){}}
function renderUtNames(){const box=document.getElementById('utUserList');if(!box)return;if(!utNames.length){box.innerHTML='<div style="padding:10px;color:#777">목록이 없으면 아래에 이름을 직접 입력하세요.</div>';return}box.innerHTML='';utNames.forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>saveUtUser(n);box.appendChild(b)})}
function openUtUser(){document.getElementById('utUserOverlay').classList.add('show');reqUtNames()}
function saveUtUser(n){n=String(n||'').trim();if(!n){alert('이름을 입력해주세요.');return}try{localStorage.setItem(UT_USER_KEY,n)}catch(_){}document.getElementById('utUserOverlay').classList.remove('show');sendUtUser();const base=localStorage.getItem(KEY)||DEFAULT_APP_URL;openApp(withDeviceUser(base))}
window.addEventListener('message',ev=>{const d=ev.data||{};if(d.type==='UNITRACK_APP_READY_FOR_USER'){sendUtUser();reqUtNames();if(!utUser())openUtUser()}if(d.type==='UNITRACK_NAME_OPTIONS'){utNames=[...new Set((d.names||[]).map(x=>String(x).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));renderUtNames()}});
window.addEventListener('load',()=>setTimeout(()=>{placeUtUser();sendUtUser();if(!utUser())openUtUser()},700));window.addEventListener('resize',()=>setTimeout(placeUtUser,80));window.addEventListener('orientationchange',()=>setTimeout(placeUtUser,220));
</script></body></html>

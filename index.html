#pwaFocusBox:before,#pwaFocusBox:after{content:"";position:absolute;width:42px;height:42px}
#pwaFocusBox:before{left:-4px;top:-4px;border-left:5px solid #fff;border-top:5px solid #fff;border-radius:12px 0 0 0}
#pwaFocusBox:after{right:-4px;bottom:-4px;border-right:5px solid #fff;border-bottom:5px solid #fff;border-radius:0 0 12px 0}
#pwaScanGuide{position:absolute;left:50%;top:10%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:18px;font-size:14px;font-weight:800;white-space:nowrap}

@media (orientation: portrait) and (max-aspect-ratio:4/5){

}

<iframe id="app" allow="camera *; microphone *; clipboard-read *; clipboard-write *" allowfullscreen></iframe>
<script>
const KEY='unitrack_apps_script_url';
function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test((u||'').trim())}

const UT_USER_KEY='unitrack_device_user_v1';
function utUser(){return String(localStorage.getItem(UT_USER_KEY)||'').trim()}
function utWithUser(u){
 const n=utUser(); if(!n)return u;
 try{const x=new URL(u);x.searchParams.set('deviceUser',n);return x.toString()}catch(_){return u}
}
function utSendUser(){
 const f=document.getElementById('app'),n=utUser();
 if(f&&f.contentWindow&&n){try{f.contentWindow.postMessage({type:'UNITRACK_DEVICE_USER',name:n},'*')}catch(_){}}
}
function utOpenUser(first){
 const o=document.getElementById('utUserOverlay'),i=document.getElementById('utUserInput');
 i.value=utUser();o.classList.add('show');
 setTimeout(()=>i.focus(),80);
}
function utInitControls(){
 const ub=document.getElementById('utUserBtn'),bb=document.getElementById('utBellBtn'),f=document.getElementById('app');
 document.getElementById('utQuickBar').style.display='grid';
  document.getElementById('utQuickBar').classList.add('utOnMain');
 if(ub)ub.onclick=()=>utOpenUser(false);
 document.getElementById('utUserSave').onclick=()=>{
   const n=document.getElementById('utUserInput').value.trim(); if(!n){alert('이름을 입력하세요.');return}
   localStorage.setItem(UT_USER_KEY,n); setTimeout(utSendUser,80); setTimeout(utSendUser,260);
   utSendUser();
   document.getElementById('utUserOverlay').classList.remove('show');
 };
 document.getElementById('utUserInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('utUserSave').click();}});
 document.getElementById('utConnectBtn').onclick=()=>document.getElementById('changeUrl')?.click();
 // V70: Google Apps Script may run inside an extra googleusercontent frame.
 // Keep the real application window supplied by its READY message.
 let utV70AppWindow=null;
 window.addEventListener('message',function(ev){
   if(ev.data && ev.data.type==='UNITRACK_APP_NAV_READY' && ev.source){
     utV70AppWindow=ev.source;
   }
 });
 const utV70SendHome=()=>{
   const payload={type:'UNITRACK_GO_HOME'};
   try{utV70AppWindow&&utV70AppWindow.postMessage(payload,'*')}catch(_){}
   try{document.getElementById('app')?.contentWindow?.postMessage(payload,'*')}catch(_){}
 };
 const utGoMainPage=()=>{
   utV49CurrentPage_='mainPage';
   document.getElementById('utQuickBar')?.classList.add('utOnMain');
   utV70SendHome();
   setTimeout(utV70SendHome,150);
   setTimeout(utV70SendHome,500);
 };
 document.getElementById('utHomeBtn').onclick=utGoMainPage;
 document.getElementById('utHomeBtn').addEventListener('touchend',function(e){
   e.preventDefault();utGoMainPage();
 },{passive:false});
 bb.onclick=()=>utBellOpen();
 if(f)f.addEventListener('load',()=>{setTimeout(utSendUser,250);});
 if(!utUser())setTimeout(()=>utOpenUser(true),350);
}
// Main-page state from the embedded Apps Script (V27).
window.addEventListener('message',function(ev){
  if(ev.source!==document.getElementById('app')?.contentWindow)return;
  const d=ev.data||{};
  if(d.type!=='UNITRACK_PAGE_CHANGE')return;
  document.getElementById('utQuickBar')?.classList.toggle('utOnMain',d.isMain===true);
});
/* V49: Android system Back from detail -> main immediately (no iframe reload). */
let utV49CurrentPage_='mainPage';
let utV49BackGuardArmed_=false;
function utV49ArmOuterBack_(){
 if(utV49BackGuardArmed_)return;
 try{history.pushState({utV49BackGuard:true},'',location.href);utV49BackGuardArmed_=true}catch(_){}
}
function utV51ReturnFromBack_(){
 if(['SFP','SKT품목','일반유니트'].includes(utV49CurrentSource_)){
   utV49CurrentPage_='listPage';
   document.getElementById('utQuickBar')?.classList.remove('utOnMain');
   const fr=document.getElementById('app');
   try{fr?.contentWindow?.postMessage({type:'UNITRACK_NAV_SOURCE_LIST',source:utV49CurrentSource_},'*')}catch(_){}
 }else utV49ReturnMain_();
}
let utV49CurrentSource_='';
let utV58ActaBackStage_=0;
function utV49ReturnMain_(){
 utV49CurrentPage_='mainPage';
 document.getElementById('utQuickBar')?.classList.add('utOnMain');
 const fr=document.getElementById('app');
 if(fr&&fr.contentWindow){
   try{fr.contentWindow.postMessage({type:'UNITRACK_GO_HOME'},'*')}catch(_){}
   try{fr.contentWindow.postMessage({type:'UNITRACK_NAV_MAIN'},'*')}catch(_){}
 }
}
window.addEventListener('message',function(ev){
 const d=ev.data||{};
 if(d.type!=='UNITRACK_PAGE_CHANGE' && d.type!=='UNITRACK_FILTER_OPEN')return;
 const fr=document.getElementById('app');
 if(!fr||!fr.contentWindow)return;
 if(ev.source!==fr.contentWindow){
   try{if(ev.origin!=='https://script.google.com'&&!ev.origin.endsWith('.googleusercontent.com'))return}catch(_){return}
 }
 if(d.type==='UNITRACK_FILTER_OPEN'){utV49CurrentPage_='filterOverlay';utV49CurrentSource_=String(d.source||utV49CurrentSource_);utV49ArmOuterBack_();return;}
 const prevPage=utV49CurrentPage_;
 utV49CurrentPage_=String(d.page||'');
 utV49CurrentSource_=String(d.source||'');
 if(utV49CurrentPage_==='acta' && prevPage!=='acta' && prevPage!=='actaDetail')utV58ActaBackStage_=0;
 // Every screen opened from the main page needs an Android Back history entry.
 if(utV49CurrentPage_!=='mainPage')utV49ArmOuterBack_();
});
window.addEventListener('popstate',function(){
 if(!utV49BackGuardArmed_)return;
 utV49BackGuardArmed_=false;
 if(utV49CurrentPage_==='actaDetail'){
   // ACTA detail -> ACTA list; keep a guard for the subsequent Back.
   utV49CurrentPage_='acta';
   utV58ActaBackStage_=1;
   try{document.getElementById('app')?.contentWindow?.postMessage({type:'UNITRACK_NAV_ACTA_LIST'},'*')}catch(_){}
   utV49ArmOuterBack_();
 }else if(utV49CurrentPage_==='detailPage'){
   if(['SFP','SKT품목','일반유니트'].includes(utV49CurrentSource_))utV51ReturnFromBack_();
   else{
     utV49CurrentPage_='home';
     try{document.getElementById('app')?.contentWindow?.postMessage({type:'UNITRACK_NAV_BACK_DETAIL'},'*')}catch(_){}
   }
 }else if(utV49CurrentPage_==='filterOverlay')utV51ReturnFromBack_();
 else if(utV49CurrentPage_==='acta' && utV58ActaBackStage_===0){
   // Requested ACTA behavior: first Back keeps the list; second Back returns to main.
   utV58ActaBackStage_=1;
   utV49ArmOuterBack_();
 }else if(utV49CurrentPage_!=='mainPage')utV49ReturnMain_();
 // Do not re-arm at the main page: Back from main is allowed to exit.
 // A new guard is created only when another subpage is opened.
});
window.addEventListener('DOMContentLoaded',utInitControls);

function openApp(u){
 document.getElementById('setup').style.display='none';
 document.getElementById('changeUrl').style.display='block';
 const f=document.getElementById('app');f.style.display='block';f.src=utWithUser(u);
}
function changeConnection(){
 const current=localStorage.getItem(KEY)||'';
 const f=document.getElementById('app');f.src='about:blank';f.style.display='none';
 document.getElementById('changeUrl').style.display='none';
 document.getElementById('setup').style.display='flex';
 const input=document.getElementById('url');input.value=current;input.focus();input.select();
}
function saveAndOpen(){
 const u=document.getElementById('url').value.trim();
 if(!valid(u)){alert('Apps Script 웹앱 /exec 주소를 입력해주세요.');return}
 localStorage.setItem(KEY,u);openApp(u);
}
const saved=localStorage.getItem(KEY);
if(saved&&valid(saved))openApp(saved);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>

<script>
let pwaScanStream=null,pwaScanTimer=null,pwaScanBusy=false,pwaScanRequester=null,pwaScanRequestId='',pwaScanPort=null,pwaQuaggaTimer=null,pwaDone=false;

function sendPwaScanResult(value){
  value=String(value||'').trim();
  if(!value||pwaDone)return;
  pwaDone=true;
  try{if(navigator.vibrate)navigator.vibrate([120,55,120])}catch(_){}
  const id=pwaScanRequestId;
  // Primary v7.14.38 bridge: GET image beacon to the same Apps Script /exec.
  // Apps Script iframe polls CacheService for this requestId.
  try{
    const base=(localStorage.getItem(KEY)||'').split('?')[0];
    if(base&&id){
      const img=new Image();
      img.style.display='none';
      img.src=base+'?action=scanResult&id='+encodeURIComponent(id)+'&value='+encodeURIComponent(value)+'&_='+Date.now();
      document.body.appendChild(img);
      setTimeout(()=>{try{img.remove()}catch(_){}},4000);

      // Hidden GET navigation reliably executes Apps Script doGet even if an image MIME redirect is rejected.
      let sink=document.getElementById('unitrackScanSink');
      if(!sink){
        sink=document.createElement('iframe');
        sink.id='unitrackScanSink';sink.name='unitrackScanSink';
        sink.style.display='none';document.body.appendChild(sink);
      }
      const form=document.createElement('form');
      form.method='GET';form.action=base;form.target='unitrackScanSink';form.style.display='none';
      [['action','scanResult'],['id',id],['value',value],['_',String(Date.now())]].forEach(function(pair){
        const inp=document.createElement('input');inp.type='hidden';inp.name=pair[0];inp.value=pair[1];form.appendChild(inp);
      });
      document.body.appendChild(form);form.submit();
      setTimeout(()=>{try{form.remove()}catch(_){}},1000);
    }
  }catch(_){}
  // Keep previous direct channels as secondary fallbacks.
  const payload={type:'UNITRACK_SCAN_RESULT',value,requestId:id};
  // Direct return paths first.
  try{if(pwaScanPort){pwaScanPort.postMessage(payload);pwaScanPort.close()}}catch(_){}
  try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
  // Google can wrap the Apps Script iframe. Broadcast to every iframe we can reach.
  try{
    document.querySelectorAll('iframe').forEach(function(fr){
      try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
    });
  }catch(_){}
  // Repeat after the camera closes; this avoids losing the message during video teardown.
  setTimeout(function(){
    try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
    try{
      document.querySelectorAll('iframe').forEach(function(fr){
        try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
      });
    }catch(_){}
    closePwaScanner();
  },180);
}

async function openPwaScanner(){
  if(pwaScanBusy)return;
  pwaScanBusy=true;pwaDone=false;
  const box=document.getElementById('pwaScanner'),video=document.getElementById('pwaScanVideo');
  box.classList.add('active');
  try{
    pwaScanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},
      audio:false
    });
    try{
      const tr=pwaScanStream.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
      if(caps.focusMode&&Array.from(caps.focusMode).includes('continuous'))
        await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(_){}
    video.srcObject=pwaScanStream;
    await video.play();

    // Native detector: fast QR + common 1D.
    if('BarcodeDetector' in window){
      let formats=[];try{formats=await BarcodeDetector.getSupportedFormats()}catch(_){}
      const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
      const use=wanted.filter(x=>formats.includes(x));
      const detector=use.length?new BarcodeDetector({formats:use}):new BarcodeDetector();
      let detecting=false;
      pwaScanTimer=setInterval(async()=>{
        if(pwaDone||detecting||!pwaScanStream||video.readyState<2)return;
        detecting=true;
        try{
          const rs=await detector.detect(video);
          const hit=rs&&rs.find(x=>x&&x.rawValue);
          if(hit)sendPwaScanResult(hit.rawValue);
        }catch(_){}
        detecting=false;
      },110);
    }

    // Quagga2 in parallel for difficult 1D warehouse barcodes.
    if(window.Quagga){
      let qbusy=false;
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
      pwaQuaggaTimer=setInterval(()=>{
        if(pwaDone||qbusy||!pwaScanStream||video.readyState<2)return;
        qbusy=true;
        try{
          const vw=video.videoWidth,vh=video.videoHeight,cw=Math.round(vw*.94),ch=Math.round(vh*.34);
          c.width=1280;c.height=Math.max(360,Math.round(1280*ch/cw));
          ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
          Quagga.decodeSingle({
            src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
            inputStream:{size:1280,singleChannel:false},
            decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
            locator:{patchSize:'medium',halfSample:false}
          },r=>{qbusy=false;const v=r&&r.codeResult&&r.codeResult.code;if(v)sendPwaScanResult(v)});
        }catch(_){qbusy=false}
      },260);
    }
  }catch(e){
    closePwaScanner();
    const fb={type:'UNITRACK_SCAN_FALLBACK',requestId:pwaScanRequestId};
    try{pwaScanRequester&&pwaScanRequester.postMessage(fb,'*')}catch(_){}
  }finally{pwaScanBusy=false}
}
function closePwaScanner(){
  if(pwaScanTimer){clearInterval(pwaScanTimer);pwaScanTimer=null}
  if(pwaQuaggaTimer){clearInterval(pwaQuaggaTimer);pwaQuaggaTimer=null}
  if(pwaScanStream){pwaScanStream.getTracks().forEach(t=>t.stop());pwaScanStream=null}
  const v=document.getElementById('pwaScanVideo');if(v)v.srcObject=null;
  const box=document.getElementById('pwaScanner');if(box)box.classList.remove('active');
  pwaScanPort=null;pwaScanRequester=null;
}
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='UNITRACK_SCAN_REQUEST'){
    pwaScanRequester=ev.source;
    pwaScanRequestId=d.requestId||'';
    pwaScanPort=(ev.ports&&ev.ports[0])||null;
    try{pwaScanPort&&pwaScanPort.start&&pwaScanPort.start()}catch(_){}
    openPwaScanner();
  }
});
</script>

<script id="ut-v37-bell-script">
(function(){
 const items=[];const seen=new Set();let unread=0;
 function render(){
   const box=document.getElementById('utBellItems');if(!box)return;
   box.replaceChildren();
   if(!items.length){const p=document.createElement('div');p.className='utBellEmpty';p.textContent='새 알림이 없습니다.';box.appendChild(p);return}
   items.forEach(e=>{
     const div=document.createElement('div');div.className='utBellEntry';
     const h=document.createElement('strong');h.textContent='🔔 UniTrack 유동이력 발생';div.appendChild(h);
     const detail=document.createElement('div');detail.textContent='Unit: '+(e.unit||'-')+'\n변경상태: '+(e.fromStatus||'-')+' → '+(e.toStatus||'-')+'\n처리자: '+(e.user||'-')+'\n변경시간: '+(e.date||'-');div.appendChild(detail);box.appendChild(div);
   });
 }
 window.utBellOpen=function(){
   const p=document.getElementById('utBellPanel');if(!p)return;
   p.hidden=!p.hidden;
   if(!p.hidden){unread=0;document.getElementById('utBellBtn')?.classList.remove('utBellUnread');render()}
 };
 window.addEventListener('message',ev=>{
   const d=ev.data||{};
   if(d.type!=='UNITRACK_LIVE_NOTIFICATION'||!d.event||!d.event.id)return;
   // Accept messages only from the embedded app frame or its Google-hosted nested frame.
   const app=document.getElementById('app');
   if(!app||!app.contentWindow)return;
   if(ev.source!==app.contentWindow){
     try{if(ev.origin!=='https://script.google.com'&&!ev.origin.endsWith('.googleusercontent.com'))return}catch(_){return}
   }
   const e=d.event;if(seen.has(e.id))return;
   seen.add(e.id);if(seen.size>500)seen.clear();
   items.unshift(e);if(items.length>100)items.length=100;
   const p=document.getElementById('utBellPanel');
   if(p&&p.hidden){unread++;document.getElementById('utBellBtn')?.classList.add('utBellUnread')}
   else render();
 });
 window.addEventListener('DOMContentLoaded',()=>{
   document.getElementById('utBellClose')?.addEventListener('click',()=>{document.getElementById('utBellPanel').hidden=true});
 });
})();
</script>

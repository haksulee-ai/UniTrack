<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1768c4"><meta name="robots" content="noindex">
<title>UniTrack 실행</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f2f5fa;color:#273243;display:grid;place-items:center;padding:20px}
.card{width:min(100%,400px);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px #12264d24}
.top{background:#1768c4;color:white;padding:24px;text-align:center;font-size:24px;font-weight:850}.body{padding:28px 22px;text-align:center}
h1{font-size:20px;margin:0 0 12px}.desc{font-size:15px;line-height:1.6;color:#596579;margin:0 0 20px}
a.button{display:flex;align-items:center;justify-content:center;background:#1768c4;color:white;border-radius:10px;min-height:52px;font-weight:800;text-decoration:none;padding:10px 14px}
small{display:block;margin-top:12px;font-size:12px;color:#6b7280;overflow-wrap:anywhere}
</style></head><body><div class="card"><div class="top">UniTrack</div><div class="body">
<h1 id="status">최신 앱에 연결 중...</h1><p class="desc" id="detail">Google Apps Script 앱으로 이동합니다.</p>
<a class="button" id="openApp" href="https://script.google.com/macros/s/AKfycbzc4PizeXGRmxLZVROYWVbFdoFBbB7Xvrm7qzOYU0xA_ZPSN2NwWxuuc1S9XWJBEnnt6w/exec">앱 열기</a><small id="version">배포 정보 확인 중...</small>
</div></div>
<script>
(function(){'use strict';
 const fallback="https://script.google.com/macros/s/AKfycbzc4PizeXGRmxLZVROYWVbFdoFBbB7Xvrm7qzOYU0xA_ZPSN2NwWxuuc1S9XWJBEnnt6w/exec";
 const status=document.getElementById('status');
 const detail=document.getElementById('detail');
 const button=document.getElementById('openApp');
 const version=document.getElementById('version');
 function valid(url){try{const u=new URL(url);return u.protocol==='https:' && u.hostname==='script.google.com' && /^\/macros\/s\/[^/]+\/exec\/?$/.test(u.pathname);}catch(e){return false;}}
 function go(url){if(!valid(url)){status.textContent='배포 주소 확인 필요';detail.textContent='Apps Script 주소를 확인해 주세요.';return;}button.href=url;status.textContent='앱을 여는 중...';detail.textContent='이동하지 않으면 아래 버튼을 눌러 주세요.';window.location.replace(url);}
 button.href=fallback;
 // Delay-free fallback link is provided even if GitHub manifest cannot be retrieved.
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),4500);
 fetch('./latest-deployment.json?t='+Date.now(),{cache:'no-store',signal:controller.signal})
 .then(r=>{if(!r.ok)throw Error('manifest HTTP '+r.status);return r.json();})
 .then(m=>{clearTimeout(timer);if(!m||!valid(m.execUrl))throw Error('invalid exec URL');version.textContent='배포 버전: '+String(m.version||'확인 불가');go(m.execUrl);})
 .catch(()=>{clearTimeout(timer);version.textContent='배포 정보 로드 실패';status.textContent='앱 연결을 확인해 주세요';detail.textContent='자동 연결에 실패했습니다. 아래 버튼으로 앱을 열 수 있습니다.';});
})();
</script></body></html>

<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
#setup{box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(680px,94vw);padding:28px;border-radius:22px;box-shadow:0 8px 30px #0002;text-align:center}
.logo{width:150px;height:150px;object-fit:contain;border-radius:24px}
h1{font-size:32px;margin:10px 0}p{font-size:18px;line-height:1.5;color:#555}
input{box-sizing:border-box;width:100%;height:58px;font-size:18px;padding:0 14px;border:1px solid #bbb;border-radius:12px}
button{width:100%;height:60px;margin-top:12px;border:0;border-radius:12px;background:#075b9b;color:#fff;font-size:22px;font-weight:800}
#app{display:none;width:100%;height:100%;border:0}
#notifyBtn{display:none;position:fixed;right:190px;top:calc(8px + env(safe-area-inset-top));z-index:100000;width:50px;height:34px;margin:0;padding:0;border:1px solid #075b9b;border-radius:18px;background:#fff;color:#075b9b;font-size:16px;font-weight:800;box-shadow:0 2px 8px #0003}
#changeUrl{display:none;position:fixed;right:66px;left:auto;top:calc(8px + env(safe-area-inset-top));z-index:99999;width:auto;height:34px;margin:0;padding:0 10px;border:1px solid #075b9b;border-radius:18px;background:#fff;color:#075b9b;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0003;white-space:nowrap}
.small{font-size:14px;color:#777}

#pwaScanner{display:none;position:fixed;inset:0;z-index:200000;background:#000}
#pwaScanner.active{display:block}
#pwaScanVideo{width:100%;height:100%;object-fit:cover;background:#000}
#pwaScanShade{position:absolute;inset:0;background:rgba(0,0,0,.08);pointer-events:none}
#pwaFocusBox{position:absolute;left:10%;right:10%;top:18%;bottom:10%;border:3px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.12);pointer-events:none}
#pwaFocusBox:before,#pwaFocusBox:after{content:"";position:absolute;width:42px;height:42px}
#pwaFocusBox:before{left:-4px;top:-4px;border-left:5px solid #fff;border-top:5px solid #fff;border-radius:12px 0 0 0}
#pwaFocusBox:after{right:-4px;bottom:-4px;border-right:5px solid #fff;border-bottom:5px solid #fff;border-radius:0 0 12px 0}
#pwaScanGuide{position:absolute;left:50%;top:10%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:18px;font-size:14px;font-weight:800;white-space:nowrap}
#pwaScanClose{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:48px;height:48px;margin:0;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:27px;z-index:2}
@media (orientation: portrait) and (max-aspect-ratio:4/5){
  #changeUrl{right:112px!important}
}

#userBadge{display:none;position:fixed;left:12px;top:calc(8px + env(safe-area-inset-top));z-index:100002;height:34px;padding:0 11px;border:1px solid #075b9b;border-radius:18px;background:#fff;color:#075b9b;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0003}
#userOverlay{display:none;position:fixed;inset:0;z-index:200000;background:rgba(0,0,0,.48);align-items:center;justify-content:center;padding:20px}
#userOverlay.show{display:flex}
#userCard{width:min(92vw,420px);max-height:78vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0005}
#userCard h3{margin:0 0 7px;font-size:20px;color:#075b9b}
#userCard p{margin:0 0 14px;color:#666;font-size:13px}
#userList{display:grid;gap:8px}
#userList button{width:100%;padding:13px;border:1px solid #d7e5ef;border-radius:12px;background:#f8fbfd;font-size:16px;font-weight:800;text-align:left}
#userManual{display:flex;gap:7px;margin-top:12px}
#userManual input{min-width:0;flex:1;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px}
#userManual button{padding:0 14px;border:0;border-radius:10px;background:#075b9b;color:#fff;font-weight:800}


/* V8.1 사용자 직접입력 가독성 */
#userManual{display:grid!important;grid-template-columns:minmax(0,1fr) 76px!important;gap:8px!important;width:100%!important;margin-top:14px!important}
#userManual input{
  box-sizing:border-box!important;
  width:100%!important;
  min-width:0!important;
  height:50px!important;
  padding:0 14px!important;
  border:1px solid #aebbc5!important;
  border-radius:11px!important;
  background:#fff!important;
  color:#111!important;
  -webkit-text-fill-color:#111!important;
  caret-color:#111!important;
  font-size:17px!important;
  font-weight:700!important;
  line-height:50px!important;
  opacity:1!important;
}
#userManual input::placeholder{color:#8a8f94!important;-webkit-text-fill-color:#8a8f94!important;font-size:14px!important;font-weight:500!important}

@media (max-width:430px){
  #userCard{width:calc(100vw - 24px)!important;padding:18px 14px!important;box-sizing:border-box!important}
}


/* V8.3 compact user icon + aligned registration row */
#userBadge{
  display:none;position:fixed;z-index:100002;
  width:36px!important;height:36px!important;padding:0!important;
  border:1px solid #075b9b!important;border-radius:50%!important;
  background:#fff!important;color:#075b9b!important;
  font-size:0!important;font-weight:800!important;
  box-shadow:0 2px 8px #0003!important;
}
#userBadge::before{content:'👤';font-size:19px;line-height:34px}
#userManual{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 76px!important;
  align-items:center!important;
  gap:8px!important;
}
#userManual input,#userManual button{
  box-sizing:border-box!important;
  height:50px!important;
  margin:0!important;
  align-self:center!important;

<body>
<div id="setup">
 <div class="card">
  <img class="logo" src="./icon-512.png" alt="UniTrack">
  <h1>UniTrack</h1>
  <p>Apps Script 배포 URL을 한 번만 입력하세요.<br>이후 홈 화면의 UniTrack 아이콘으로 바로 실행됩니다.</p>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/...../exec">
  <button onclick="saveAndOpen()">UniTrack 연결</button>
  <p class="small">배포 URL은 이 기기에만 저장됩니다.</p>
 </div>
</div>

<button id="userBadge" type="button" onclick="openUserRegistration(true)" title="사용자 변경">사용자</button>
<div id="userOverlay">
  <div id="userCard">
    <h3>UniTrack 사용자 등록</h3>
    <p>이 기기에서 작업할 이름을 선택하세요. 이후 신규등록과 구성정보변경의 Name에 자동 저장됩니다.</p>
    <div id="userList"><div style="padding:12px;color:#777">사용자 목록 불러오는 중…</div></div>
    <div id="userManual"><input id="userManualName" type="text" placeholder="목록에 없으면 이름 직접 입력"><button type="button" onclick="saveDeviceUser(document.getElementById('userManualName').value)">등록</button></div>
  </div>
</div>

<button id="notifyBtn" type="button" onclick="enableNotifications()" title="알림 설정">🔔</button>
<button id="changeUrl" type="button" onclick="changeConnection()">연결 주소 변경</button>
<div id="pwaScanner">
  <video id="pwaScanVideo" playsinline autoplay muted></video>
  <div id="pwaScanShade"></div>
  <div id="pwaFocusBox"><div id="pwaLaser"></div></div>
  <div id="pwaScanGuide">바코드 / QR 코드를 네모 안에 맞춰주세요</div>
  <button id="pwaScanClose" type="button" onclick="closePwaScanner()">×</button>
</div>
<iframe id="app" allow="camera *; microphone *; clipboard-read *; clipboard-write *" allowfullscreen></iframe>
<script>
const KEY='unitrack_apps_script_url';
const DEFAULT_APP_URL='https://script.google.com/macros/s/AKfycby94pRfhnMGDxpsgcbzexB7-HjPHKGAmhZkg7MnQFTot7CGCXUSP-LIi-kRDUSwfOCv/exec';
function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test((u||'').trim())}
function openApp(u){
 document.getElementById('setup').style.display='none';
 document.getElementById('changeUrl').style.display='block';
 document.getElementById('notifyBtn').style.display='block';
 setTimeout(placeNotifyButton,0);
 const f=document.getElementById('app');f.style.display='block';f.src=u;
}
function changeConnection(){
 const current=localStorage.getItem(KEY)||DEFAULT_APP_URL;
 const u=prompt('Apps Script 웹앱 /exec 연결주소를 입력하세요.',current);
 if(u===null)return;
 const v=String(u).trim();
 if(!valid(v)){alert('Apps Script 웹앱 /exec 주소를 확인해주세요.');return}
 try{localStorage.setItem(KEY,v)}catch(_){}
 openApp(v);
 postDeviceUser();
}
function saveAndOpen(){
 const u=document.getElementById('url').value.trim();
 if(!valid(u)){alert('Apps Script 웹앱 /exec 주소를 입력해주세요.');return}
 localStorage.setItem(KEY,u);openApp(u);
}
let saved='';
try{saved=localStorage.getItem(KEY)||''}catch(_){}
if(!valid(saved)){
 saved=DEFAULT_APP_URL;
 try{localStorage.setItem(KEY,saved)}catch(_){}
}
openApp(saved);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
<script>


function placeNotifyButton(){
  const b=document.getElementById('notifyBtn'), c=document.getElementById('changeUrl');
  if(!b||!c||getComputedStyle(c).display==='none')return;
  // Let the existing responsive CSS determine the connection button's horizontal position.
  // Use its rendered center as the shared vertical center.
  b.style.setProperty('right','auto','important');
  b.style.setProperty('bottom','auto','important');
  const r=c.getBoundingClientRect();
  const cy=r.top+r.height/2;
  b.style.setProperty('left',Math.max(8,r.left-b.offsetWidth-8)+'px','important');
  b.style.setProperty('top',(cy-b.offsetHeight/2)+'px','important');
  c.style.setProperty('top',(cy-c.offsetHeight/2)+'px','important');
}
window.addEventListener('resize',placeNotifyButton);
window.addEventListener('orientationchange',()=>setTimeout(placeNotifyButton,150));
setTimeout(placeNotifyButton,250);

async function enableNotifications(){
  if(!('Notification' in window)){alert('이 기기/브라우저는 웹 알림을 지원하지 않습니다.');return}
  let p=Notification.permission;
  if(p!=='granted') p=await Notification.requestPermission();
  if(p!=='granted'){alert('UniTrack 알림 권한이 허용되지 않았습니다.');return}
  localStorage.setItem('unitrack_notify_enabled','1');
  const reg=await navigator.serviceWorker.ready;
  await reg.showNotification('UniTrack 알림 테스트',{
    body:'알림 연결 완료 · 통합시트 기록 시 알림을 표시합니다.',
    icon:'./icon-192.png',badge:'./icon-192.png',tag:'unitrack-test',renotify:true
  });
}
let lastMovementNoticeKey='',lastMovementNoticeAt=0;
async function showMovementNotification(d){
  if(localStorage.getItem('unitrack_notify_enabled')!=='1')return;
  const noticeKey=[d.savedAt||'',d.barcode||'',d.serial||'',d.toStatus||''].join('|');
  const now=Date.now();
  if(noticeKey && noticeKey===lastMovementNoticeKey && now-lastMovementNoticeAt<2500)return;
  lastMovementNoticeKey=noticeKey; lastMovementNoticeAt=now;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const unit=String(d.unit||'-');
  const fromStatus=String(d.fromStatus||'').trim();
  const toStatus=String(d.toStatus||'통합시트 기록').trim();
  const statusText=(fromStatus && fromStatus!==toStatus) ? (fromStatus+' → '+toStatus) : toStatus;
  const barcode=String(d.barcode||'-');
  const serial=String(d.serial||'-');
  const savedAt=String(d.savedAt||new Date().toLocaleString('ko-KR'));
  const name=String(d.name||'-');
  const body=[
    'Unit : '+unit,
    '변경상태 : '+statusText,
    'SKT바코드 : '+barcode,
    'Serial No. : '+serial,
    '날짜/시간 : '+savedAt,
    '처리자 : '+name
  ].join('\n');
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('UniTrack 유동기록',{
      body:body,icon:'./icon-192.png',badge:'./icon-192.png',
      tag:'unitrack-v4-movement-'+Date.now(),renotify:true,data:{url:location.href}
    });
    if(navigator.vibrate)navigator.vibrate([100,50,100]);
  }catch(_){}
}
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.type==='UNITRACK_MOVEMENT_SAVED') showMovementNotification(d);
});

</script>

<script>
let pwaScanStream=null,pwaScanTimer=null,pwaScanBusy=false,pwaScanRequester=null,pwaScanRequestId='',pwaScanPort=null,pwaQuaggaTimer=null,pwaDone=false;

function sendPwaScanResult(value){
  value=String(value||'').trim();
  if(!value||pwaDone)return;
  pwaDone=true;
  try{if(navigator.vibrate)navigator.vibrate([120,55,120])}catch(_){}
  const id=pwaScanRequestId;
  // Primary v7.14.38 bridge: GET image beacon to the same Apps Script /exec.
  // Apps Script iframe polls CacheService for this requestId.
  try{
    const base=(localStorage.getItem(KEY)||'').split('?')[0];
    if(base&&id){
      const img=new Image();
      img.style.display='none';
      img.src=base+'?action=scanResult&id='+encodeURIComponent(id)+'&value='+encodeURIComponent(value)+'&_='+Date.now();
      document.body.appendChild(img);
      setTimeout(()=>{try{img.remove()}catch(_){}},4000);

      // Hidden GET navigation reliably executes Apps Script doGet even if an image MIME redirect is rejected.
      let sink=document.getElementById('unitrackScanSink');
      if(!sink){
        sink=document.createElement('iframe');
        sink.id='unitrackScanSink';sink.name='unitrackScanSink';
        sink.style.display='none';document.body.appendChild(sink);
      }
      const form=document.createElement('form');
      form.method='GET';form.action=base;form.target='unitrackScanSink';form.style.display='none';
      [['action','scanResult'],['id',id],['value',value],['_',String(Date.now())]].forEach(function(pair){
        const inp=document.createElement('input');inp.type='hidden';inp.name=pair[0];inp.value=pair[1];form.appendChild(inp);
      });
      document.body.appendChild(form);form.submit();
      setTimeout(()=>{try{form.remove()}catch(_){}},1000);
    }
  }catch(_){}
  // Keep previous direct channels as secondary fallbacks.
  const payload={type:'UNITRACK_SCAN_RESULT',value,requestId:id};
  // Direct return paths first.
  try{if(pwaScanPort){pwaScanPort.postMessage(payload);pwaScanPort.close()}}catch(_){}
  try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
  // Google can wrap the Apps Script iframe. Broadcast to every iframe we can reach.
  try{
    document.querySelectorAll('iframe').forEach(function(fr){
      try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
    });
  }catch(_){}
  // Repeat after the camera closes; this avoids losing the message during video teardown.
  setTimeout(function(){
    try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
    try{
      document.querySelectorAll('iframe').forEach(function(fr){
        try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
      });
    }catch(_){}
    closePwaScanner();
  },180);
}

async function openPwaScanner(){
  if(pwaScanBusy)return;
  pwaScanBusy=true;pwaDone=false;
  const box=document.getElementById('pwaScanner'),video=document.getElementById('pwaScanVideo');
  box.classList.add('active');
  try{
    pwaScanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},
      audio:false
    });
    try{
      const tr=pwaScanStream.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
      if(caps.focusMode&&Array.from(caps.focusMode).includes('continuous'))
        await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(_){}
    video.srcObject=pwaScanStream;
    await video.play();

    // Native detector: fast QR + common 1D.
    if('BarcodeDetector' in window){
      let formats=[];try{formats=await BarcodeDetector.getSupportedFormats()}catch(_){}
      const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
      const use=wanted.filter(x=>formats.includes(x));
      const detector=use.length?new BarcodeDetector({formats:use}):new BarcodeDetector();
      let detecting=false;
      pwaScanTimer=setInterval(async()=>{
        if(pwaDone||detecting||!pwaScanStream||video.readyState<2)return;
        detecting=true;
        try{
          const rs=await detector.detect(video);
          const hit=rs&&rs.find(x=>x&&x.rawValue);
          if(hit)sendPwaScanResult(hit.rawValue);
        }catch(_){}
        detecting=false;
      },110);
    }

    // Quagga2 in parallel for difficult 1D warehouse barcodes.
    if(window.Quagga){
      let qbusy=false;
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
      pwaQuaggaTimer=setInterval(()=>{
        if(pwaDone||qbusy||!pwaScanStream||video.readyState<2)return;
        qbusy=true;
        try{
          const vw=video.videoWidth,vh=video.videoHeight,cw=Math.round(vw*.94),ch=Math.round(vh*.34);
          c.width=1280;c.height=Math.max(360,Math.round(1280*ch/cw));
          ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
          Quagga.decodeSingle({
            src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
            inputStream:{size:1280,singleChannel:false},
            decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
            locator:{patchSize:'medium',halfSample:false}
          },r=>{qbusy=false;const v=r&&r.codeResult&&r.codeResult.code;if(v)sendPwaScanResult(v)});
        }catch(_){qbusy=false}
      },260);
    }
  }catch(e){
    closePwaScanner();
    const fb={type:'UNITRACK_SCAN_FALLBACK',requestId:pwaScanRequestId};
    try{pwaScanRequester&&pwaScanRequester.postMessage(fb,'*')}catch(_){}
  }finally{pwaScanBusy=false}
}
function closePwaScanner(){
  if(pwaScanTimer){clearInterval(pwaScanTimer);pwaScanTimer=null}
  if(pwaQuaggaTimer){clearInterval(pwaQuaggaTimer);pwaQuaggaTimer=null}
  if(pwaScanStream){pwaScanStream.getTracks().forEach(t=>t.stop());pwaScanStream=null}
  const v=document.getElementById('pwaScanVideo');if(v)v.srcObject=null;
  const box=document.getElementById('pwaScanner');if(box)box.classList.remove('active');
  pwaScanPort=null;pwaScanRequester=null;
}
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='UNITRACK_SCAN_REQUEST'){
    pwaScanRequester=ev.source;
    pwaScanRequestId=d.requestId||'';
    pwaScanPort=(ev.ports&&ev.ports[0])||null;
    try{pwaScanPort&&pwaScanPort.start&&pwaScanPort.start()}catch(_){}
    openPwaScanner();
  }
});
</script>

<script>
(function(){
  const FIXED='https://script.google.com/macros/s/AKfycby94pRfhnMGDxpsgcbzexB7-HjPHKGAmhZkg7MnQFTot7CGCXUSP-LIi-kRDUSwfOCv/exec';
  function bootUniTrack(){
    let target=FIXED;
    try{
      const x=localStorage.getItem('unitrack_apps_script_url')||'';
      if(/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(x.trim())) target=x.trim();
      else localStorage.setItem('unitrack_apps_script_url',FIXED);
    }catch(e){}
    const f=document.getElementById('app') || document.querySelector('iframe');
    if(!f) return;
    if(f.getAttribute('src')!==target) f.setAttribute('src',target);
    f.style.display='block';
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',bootUniTrack,{once:true});
  } else {
    bootUniTrack();
  }
  window.addEventListener('pageshow',bootUniTrack);
})();
</script>

<script>
/* UniTrack V8 - per-device user registration */
const UNITRACK_USER_KEY='unitrack_device_user_v1';
let unitrackUserOptions=[];

function currentDeviceUser(){
  try{return (localStorage.getItem(UNITRACK_USER_KEY)||'').trim()}catch(_){return ''}
}
function postDeviceUser(){
  const name=currentDeviceUser();
  const f=document.getElementById('app')||document.querySelector('iframe');
  if(f&&f.contentWindow){
    try{f.contentWindow.postMessage({type:'UNITRACK_DEVICE_USER',name:name},'*')}catch(_){}
  }
  const b=document.getElementById('userBadge');
  if(b){b.textContent='';b.title=name?('사용자 : '+name+' (변경)'):'사용자 등록';b.setAttribute('aria-label',b.title);b.style.display='block';placeUserButton();}
}

function placeUserButton(){
  const u=document.getElementById('userBadge');
  const n=document.getElementById('notifyBtn');
  const c=document.getElementById('changeUrl');
  if(!u)return;
  const anchor=(n&&n.offsetParent!==null)?n:c;
  if(!anchor)return;
  const r=anchor.getBoundingClientRect();
  const w=36;
  u.style.left=Math.max(6,r.left-w-7)+'px';
  u.style.top=(r.top+(r.height-w)/2)+'px';
  u.style.right='auto';
}
window.addEventListener('resize',()=>setTimeout(placeUserButton,50));
window.addEventListener('orientationchange',()=>setTimeout(placeUserButton,180));

function requestUserOptions(){
  const f=document.getElementById('app')||document.querySelector('iframe');
  if(f&&f.contentWindow){
    try{f.contentWindow.postMessage({type:'UNITRACK_REQUEST_NAME_OPTIONS'},'*')}catch(_){}
  }
}
function renderUserOptions(){
  const box=document.getElementById('userList'); if(!box)return;
  if(!unitrackUserOptions.length){
    box.innerHTML='<div style="padding:12px;color:#777">기존 Name 목록을 불러오지 못했습니다. 아래에서 이름을 직접 입력할 수 있습니다.</div>';
    return;
  }
  box.innerHTML=unitrackUserOptions.map(n=>'<button type="button" data-user-name></button>').join('');
  [...box.querySelectorAll('[data-user-name]')].forEach((b,i)=>{
    b.textContent=unitrackUserOptions[i];
    b.onclick=()=>saveDeviceUser(unitrackUserOptions[i]);
  });
}
function openUserRegistration(force){
  const o=document.getElementById('userOverlay'); if(!o)return;
  o.classList.add('show');
  requestUserOptions();
  if(force) setTimeout(requestUserOptions,500);
}
function saveDeviceUser(name){
  name=String(name||'').trim();
  if(!name){alert('사용자 이름을 선택하거나 입력해주세요.');return}
  try{localStorage.setItem(UNITRACK_USER_KEY,name)}catch(_){}
  document.getElementById('userOverlay').classList.remove('show');
  postDeviceUser();
}
window.addEventListener('message',function(ev){
  const d=ev.data||{};
  if(d.type==='UNITRACK_APP_READY_FOR_USER'){
    postDeviceUser();
    requestUserOptions();
    if(!currentDeviceUser()) openUserRegistration(false);
  }
  if(d.type==='UNITRACK_NAME_OPTIONS'){
    unitrackUserOptions=[...new Set((d.names||[]).map(x=>String(x).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    renderUserOptions();
  }
});
window.addEventListener('load',function(){
  setTimeout(function(){
    postDeviceUser();
    if(!currentDeviceUser()) openUserRegistration(false);
    requestUserOptions();
  },900);
});
</script>

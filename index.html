<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d609d"><meta name="application-name" content="UniTrack"><meta name="apple-mobile-web-app-title" content="UniTrack"><meta name="apple-mobile-web-app-capable" content="yes"><title>UniTrack V119</title><link id="appFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%230d609d'/%3E%3Ctext x='48' y='62' text-anchor='middle' font-size='46' font-weight='bold' fill='white'%3EUT%3C/text%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#f2f4f8}#frame{width:100%;height:100%;border:0;display:block}#fallback{display:none;position:fixed;bottom:20px;left:12px;right:12px;z-index:5;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 18px #0003;text-align:center;font:14px system-ui,sans-serif;color:#333}#fallback a{display:block;background:#1768c4;color:white;padding:12px;border-radius:8px;text-decoration:none;margin-top:9px;font-weight:700}#fallback button{background:none;border:0;color:#777;padding:8px;margin-top:4px}#cameraHelp{position:fixed;right:10px;bottom:12px;z-index:6;background:#fff;border:1px solid #d1d5db;border-radius:9px;font:600 12px system-ui;color:#1768c4;padding:7px 10px;box-shadow:0 2px 8px #0002;text-decoration:none;opacity:.92}#scanShell{display:none;position:fixed;inset:0;z-index:100;background:#0d1016;color:#fff;font-family:system-ui;flex-direction:column}#scanShell.active{display:flex}#scanShell video{width:100%;min-height:0;flex:1;object-fit:cover}#scanShell .scanActions{padding:10px 14px 20px;text-align:center;background:#111827}#scanShell button{padding:10px 22px;background:#fff;border:0;border-radius:9px;font-weight:750}#scanShell p{margin:6px;font-size:14px}</style></head><body><iframe id="frame" title="UniTrack 로그인 및 관리 화면" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" loading="eager"></iframe><a id="cameraHelp" target="_blank" rel="noopener">📷 촬영·스캔이 안 되나요?</a><div id="scanShell"><video id="nativeScanVideo" autoplay muted playsinline></video><div class="scanActions"><p id="nativeScanText">카메라를 준비하는 중...</p><button id="nativeScanClose" type="button">닫기</button></div></div><div id="fallback">모바일 브라우저에서 로그인 확인이 계속되면, 아래 버튼으로 앱을 직접 실행해 주세요.<a id="direct" rel="noopener" target="_blank">UniTrack 직접 열기</a><button id="dismiss">안내 닫기</button></div><script>(function(){const fallback='https://script.google.com/macros/s/AKfycbzc4PizeXGRmxLZVROYWVbFdoFBbB7Xvrm7qzOYU0xA_ZPSN2NwWxuuc1S9XWJBEnnt6w/exec';const frame=document.getElementById('frame');const direct=document.getElementById('direct');const notice=document.getElementById('fallback');let appReady=false;function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#].*)?$/.test(u)}function go(u){if(!valid(u))return;direct.href=u;document.getElementById('cameraHelp').href=u;if(frame.getAttribute('src')!==u)frame.setAttribute('src',u)}go(fallback);fetch('./latest-deployment.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():null).then(x=>{if(x&&valid(x.execUrl))go(x.execUrl)}).catch(()=>{});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const d=e.data||{};if(d.type==='UNITRACK_FAVICON_DATA'&&typeof d.src==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,/.test(d.src)&&d.src.length<3000000){let fav=document.getElementById('appFavicon');fav.href=d.src;fav.type='image/png'}if(d.type==='UNITRACK_APP_NAV_READY'){appReady=true;notice.style.display='none';}});setTimeout(()=>{if(!appReady)notice.style.display='block'},12000);document.getElementById('dismiss').onclick=()=>notice.style.display='none';})();</script><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><script>
(function(){
 const box=document.getElementById('scanShell'),video=document.getElementById('nativeScanVideo'),msg=document.getElementById('nativeScanText');
 let stream=null,reader=null,detector=null,raf=0,job='',running=false;
 const supported=/^(https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com))(?:\/|$)/i;
 function end(){running=false;cancelAnimationFrame(raf);try{if(reader&&reader.reset)reader.reset()}catch(_){}reader=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;box.classList.remove('active')}
 document.getElementById('nativeScanClose').onclick=end;
 function finish(value){if(!running||!value)return;const f=document.getElementById('frame');try{f.contentWindow.postMessage({type:'UNITRACK_SCAN_RESULT',value:String(value).trim(),requestId:job},'*')}catch(_){}end()}
 async function start(requestId){end();job=requestId;running=true;box.classList.add('active');msg.textContent='카메라 준비 중...';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();msg.textContent='바코드 / QR 코드를 비춰주세요';
   if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','qr_code','itf','codabar','upc_a','upc_e']})}catch(_){detector=new BarcodeDetector()}}
   else if(window.ZXing){reader=new ZXing.BrowserMultiFormatReader();}
   else{msg.textContent='이 브라우저의 스캔 엔진을 사용할 수 없습니다. 직접 열기를 이용해 주세요.';return}
   const tick=async()=>{if(!running)return;try{if(detector){let a=await detector.detect(video);if(a.length){finish(a[0].rawValue);return}}else if(reader){const r=await reader.decodeFromVideoElement(video);if(r){finish(r.getText());return}}}catch(_){}if(running)raf=requestAnimationFrame(tick)};tick();
  }catch(e){msg.textContent='카메라 권한이 차단되었습니다. 닫은 뒤 하단의 직접 열기를 사용해 주세요.'}
 }
 window.addEventListener('message',e=>{if(e.source!==document.getElementById('frame').contentWindow)return;if(!supported.test(e.origin))return;
  const d=e.data||{};if(d.type!=='UNITRACK_SCAN_REQUEST')return;
  e.source.postMessage({type:'UNITRACK_SCAN_ACK',requestId:d.requestId},e.origin);
  start(String(d.requestId||''));
 });
})();
</script></body></html>

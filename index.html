<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UniTrack"><title>UniTrack</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#f3f5fa;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}#utShell{position:fixed;inset:0;background:#f3f5fa}#utFrame{position:absolute;width:100%;height:100%;inset:0;border:0;background:#f3f5fa}#utNotice{position:absolute;left:10%;right:10%;bottom:14%;padding:14px 17px;background:white;border-radius:14px;box-shadow:0 3px 18px #0002;text-align:center;font-size:14px;color:#4b5563;display:none;z-index:5}#utNotice a{display:inline-block;background:#1768c4;color:white;padding:12px 18px;border-radius:9px;text-decoration:none;margin-top:12px;font-weight:bold}#utDebug{position:absolute;top:0;left:0;right:0;padding:7px;background:#ffe9a6;font-size:12px;z-index:3;display:none}
</style></head><body><div id="utShell"><iframe id="utFrame" title="UniTrack 사용자 로그인 및 앱" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe><div id="utNotice">로그인 화면이 보이지 않나요?<br>브라우저에서 iframe 사용이 제한될 수 있습니다.<br><a id="utOpen" target="_blank" rel="noopener noreferrer">Apps Script에서 열기</a></div></div>
<script>
(function(){
'use strict';
const FALLBACK='https://script.google.com/macros/s/AKfycbzc4PizeXGRmxLZVROYWVbFdoFBbB7Xvrm7qzOYU0xA_ZPSN2NwWxuuc1S9XWJBEnnt6w/exec';
const frame=document.getElementById('utFrame'),note=document.getElementById('utNotice'),link=document.getElementById('utOpen');
let current=FALLBACK,loaded=false,ready=false;
function valid(s){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#].*)?$/.test(s)}
function setAddress(s){if(!valid(s))return;current=s;link.href=s;if(frame.src!==s){loaded=false;frame.src=s}}
setAddress(FALLBACK);
frame.addEventListener('load',()=>{loaded=true;/* load does not guarantee that Apps Script authentication succeeded */});
window.addEventListener('message',e=>{
 const d=e.data||{};
 if(d.type==='UNITRACK_APP_NAV_READY'){ready=true;note.style.display='none';try{frame.contentWindow.postMessage({type:'UNITRACK_EXEC_URL',url:current},'*')}catch(_){}}
 if(d.type==='UNITRACK_APPLY_LATEST' && valid(d.verifiedUrl)){
  setAddress(d.verifiedUrl);
  try{frame.contentWindow.postMessage({type:'UNITRACK_APPLY_LATEST_RESULT',ok:true},'*')}catch(_){}
 }
 if(d.type==='UNITRACK_SCAN_REQUEST'){
  /* Existing app camera scanner runs in the embedded Apps Script frame. */
 }
});
fetch('./latest-deployment.json?ut='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&valid(j.execUrl))setAddress(j.execUrl)}).catch(()=>{});
setTimeout(()=>{if(!ready)note.style.display='block'},13000);
})();
</script></body></html>

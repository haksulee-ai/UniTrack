<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b9b">
<title>UniTrack</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
#setup{box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(680px,94vw);padding:28px;border-radius:22px;box-shadow:0 8px 30px #0002;text-align:center}
.logo{width:150px;height:150px;object-fit:contain;border-radius:24px}
h1{font-size:32px;margin:10px 0}p{font-size:18px;line-height:1.5;color:#555}
input{box-sizing:border-box;width:100%;height:58px;font-size:18px;padding:0 14px;border:1px solid #bbb;border-radius:12px}
button{width:100%;height:60px;margin-top:12px;border:0;border-radius:12px;background:#075b9b;color:#fff;font-size:22px;font-weight:800}
#app{display:none;width:100%;height:100%;border:0}
#changeUrl{display:none;position:fixed;right:66px;left:auto;top:calc(8px + env(safe-area-inset-top));z-index:99999;width:auto;height:34px;margin:0;padding:0 10px;border:1px solid #075b9b;border-radius:18px;background:#fff;color:#075b9b;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0003;white-space:nowrap}
.small{font-size:14px;color:#777}

#pwaScanner{display:none;position:fixed;inset:0;z-index:200000;background:#000}
#pwaScanner.active{display:block}
#pwaScanVideo{width:100%;height:100%;object-fit:cover;background:#000}
#pwaScanShade{position:absolute;inset:0;background:rgba(0,0,0,.08);pointer-events:none}
#pwaFocusBox{position:absolute;left:10%;right:10%;top:18%;bottom:10%;border:3px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.12);pointer-events:none}
#pwaFocusBox:before,#pwaFocusBox:after{content:"";position:absolute;width:42px;height:42px}
#pwaFocusBox:before{left:-4px;top:-4px;border-left:5px solid #fff;border-top:5px solid #fff;border-radius:12px 0 0 0}
#pwaFocusBox:after{right:-4px;bottom:-4px;border-right:5px solid #fff;border-bottom:5px solid #fff;border-radius:0 0 12px 0}
#pwaScanGuide{position:absolute;left:50%;top:10%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:18px;font-size:14px;font-weight:800;white-space:nowrap}
#pwaScanClose{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:48px;height:48px;margin:0;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:27px;z-index:2}
@media (orientation: portrait) and (max-aspect-ratio:4/5){
  #changeUrl{right:112px!important}
}
</style>

<style>
/* v7.14.24: portrait only.
   Keep wide/landscape exactly as v7.14.23. */
@media (orientation: portrait) and (max-aspect-ratio: 4/5){
  #changeUrl{
    right:82px!important;
  }
}
</style>

<style id="unitrack-pwa-scan-v71437">
/* v7.14.37 — PWA owns the visible scanner UI */
#pwaScannerOverlay .pwaScanFrame,
#scannerOverlay .scanFrame,
.scan-overlay .scan-frame{
  position:absolute!important;
  left:6%!important; right:6%!important;
  top:28%!important; height:300px!important;
  width:auto!important;
  border:3px solid rgba(255,255,255,.98)!important;
  border-radius:18px!important;
  box-shadow:0 0 0 9999px rgba(0,0,0,.22),0 0 18px rgba(255,255,255,.35)!important;
  overflow:hidden!important;
  z-index:20!important;
}
#pwaScannerOverlay .pwaScanFrame::before,
#scannerOverlay .scanFrame::before,
.scan-overlay .scan-frame::before{
  content:""!important; position:absolute!important;
  left:3%!important; right:3%!important; top:8%!important;
  height:4px!important; border-radius:4px!important;
  background:#ff1638!important;
  box-shadow:0 0 4px #fff,0 0 10px #ff1638,0 0 20px #ff1638!important;
  animation:unitrackPwaLaser 1.15s ease-in-out infinite alternate!important;
  z-index:30!important;
}
@keyframes unitrackPwaLaser{
  from{transform:translateY(0)}
  to{transform:translateY(245px)}
}
#pwaScannerOverlay .pwaScanFrame::after,
#scannerOverlay .scanFrame::after,
.scan-overlay .scan-frame::after{
  content:""!important; position:absolute!important; inset:10px!important;
  border:1px solid rgba(255,255,255,.34)!important;
  border-radius:12px!important; pointer-events:none!important;
}
@media (orientation:landscape){
 #pwaScannerOverlay .pwaScanFrame,#scannerOverlay .scanFrame,.scan-overlay .scan-frame{
   left:18%!important;right:18%!important;top:18%!important;height:280px!important;
 }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<style id="unitrack-pwa-scan-v71438">
#pwaFocusBox{
  position:absolute!important;left:7%!important;right:7%!important;
  top:25%!important;bottom:auto!important;height:310px!important;
  border:3px solid #fff!important;border-radius:18px!important;
  box-shadow:0 0 0 9999px rgba(0,0,0,.20),0 0 16px rgba(255,255,255,.45)!important;
  overflow:hidden!important;z-index:20!important;pointer-events:none!important;
}
#pwaLaser{
  display:block!important;position:absolute!important;
  left:3%!important;right:3%!important;top:7%!important;height:5px!important;
  background:#ff1538!important;border-radius:5px!important;
  box-shadow:0 0 4px #fff,0 0 11px #ff1538,0 0 22px #ff1538!important;
  animation:pwaLaserSweep 1.05s ease-in-out infinite alternate!important;
  will-change:transform!important;z-index:30!important;
}
@keyframes pwaLaserSweep{from{transform:translateY(0)}to{transform:translateY(260px)}}
#pwaScanGuide{z-index:25!important}
@media (orientation:landscape){
 #pwaFocusBox{left:18%!important;right:18%!important;top:18%!important;height:280px!important}
 @keyframes pwaLaserSweep{from{transform:translateY(0)}to{transform:translateY(230px)}}
}

<style>
#utQuickBar{position:fixed;top:10px;right:12px;z-index:10020;display:none;grid-template-columns:repeat(4,42px);gap:7px;align-items:center}
.utQuickBtn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#096ca8;font-size:20px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0}
#utUserOverlay{display:none;position:fixed;inset:0;z-index:300000;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:18px}
#utUserOverlay.show{display:flex}
#utUserBox{width:min(92vw,420px);background:#fff;border-radius:18px;padding:20px;box-sizing:border-box}
#utUserBox h3{margin:0 0 14px;font-size:20px}
#utUserRow{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:stretch;width:100%}
#utUserInput{box-sizing:border-box;width:100%;min-width:0;height:46px;border:1px solid #bbb;border-radius:10px;padding:0 12px;font-size:16px;line-height:46px}
#utUserSave{box-sizing:border-box;width:82px;height:46px;border:0;border-radius:10px;background:#0875b8;color:#fff;font-weight:800;font-size:16px;margin:0;padding:0}
</style>

</head>
<body>

<div id="utQuickBar">
 <button id="utBellBtn" class="utQuickBtn" type="button" title="알림 설정">🔔</button>
 <button id="utUserBtn" class="utQuickBtn" type="button" title="사용자 설정">👤</button>
 <button id="utConnectBtn" class="utQuickBtn" type="button" title="연결주소 변경" aria-label="연결주소 변경">
<svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path fill="currentColor" d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a4 4 0 1 1 5.7 5.6l-3.2 3.2a4 4 0 0 1-5.7 0 1 1 0 1 1 1.4-1.4 2 2 0 0 0 2.9 0l3.2-3.2a2 2 0 1 0-2.9-2.8L12 13.4a1 1 0 0 1-1.4 0Zm2.8-2.8a1 1 0 0 1 0 1.4l-2.8 2.8a4 4 0 1 1-5.7-5.6L8.1 6a4 4 0 0 1 5.7 0 1 1 0 1 1-1.4 1.4 2 2 0 0 0-2.9 0l-3.2 3.2a2 2 0 1 0 2.9 2.8l2.8-2.8a1 1 0 0 1 1.4 0Z"/></svg>
</button>
<button id="utHomeBtn" class="utQuickBtn" type="button" title="메인장">
<svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path fill="currentColor" d="M12 3.2 3 10.4V21h6v-6h6v6h6V10.4L12 3.2zm7 15.8h-2v-6H7v6H5v-7.6l7-5.6 7 5.6V19z"/></svg>
</button>
</div>
<div id="utUserOverlay">
 <div id="utUserBox">
  <h3>UniTrack 사용자 지정</h3>
  <div id="utUserRow"><input id="utUserInput" autocomplete="name" placeholder="이름 입력"><button id="utUserSave" type="button">등록</button></div>
 </div>
</div>

<div id="setup">
 <div class="card">
  <img class="logo" src="./icon-512.png" alt="UniTrack">
  <h1>UniTrack</h1>
  <p>Apps Script 배포 URL을 한 번만 입력하세요.<br>이후 홈 화면의 UniTrack 아이콘으로 바로 실행됩니다.</p>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/...../exec">
  <button onclick="saveAndOpen()">UniTrack 연결</button>
  <p class="small">배포 URL은 이 기기에만 저장됩니다.</p>
 </div>
</div>
<button id="changeUrl" type="button" onclick="changeConnection()">연결 주소 변경</button>
<div id="pwaScanner">
  <video id="pwaScanVideo" playsinline autoplay muted></video>
  <div id="pwaScanShade"></div>
  <div id="pwaFocusBox"><div id="pwaLaser"></div></div>
  <div id="pwaScanGuide">바코드 / QR 코드를 네모 안에 맞춰주세요</div>
  <button id="pwaScanClose" type="button" onclick="closePwaScanner()">×</button>
</div>
<iframe id="app" allow="camera *; microphone *; clipboard-read *; clipboard-write *" allowfullscreen></iframe>
<script>
const KEY='unitrack_apps_script_url';
function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test((u||'').trim())}

const UT_USER_KEY='unitrack_device_user_v1';
function utUser(){return String(localStorage.getItem(UT_USER_KEY)||'').trim()}
function utWithUser(u){
 const n=utUser(); if(!n)return u;
 try{const x=new URL(u);x.searchParams.set('deviceUser',n);return x.toString()}catch(_){return u}
}
function utSendUser(){
 const f=document.getElementById('app'),n=utUser();
 if(f&&f.contentWindow&&n){try{f.contentWindow.postMessage({type:'UNITRACK_DEVICE_USER',name:n},'*')}catch(_){}}
}
function utOpenUser(first){
 const o=document.getElementById('utUserOverlay'),i=document.getElementById('utUserInput');
 i.value=utUser();o.classList.add('show');
 setTimeout(()=>i.focus(),80);
}
function utInitControls(){
 const ub=document.getElementById('utUserBtn'),bb=document.getElementById('utBellBtn'),f=document.getElementById('app');
 document.getElementById('utQuickBar').style.display='grid';
 ub.onclick=()=>utOpenUser(false);
 document.getElementById('utUserSave').onclick=()=>{
   const n=document.getElementById('utUserInput').value.trim(); if(!n){alert('이름을 입력하세요.');return}
   localStorage.setItem(UT_USER_KEY,n);
   utSendUser();
   document.getElementById('utUserOverlay').classList.remove('show');
 };
 document.getElementById('utUserInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('utUserSave').click();}});
 document.getElementById('utConnectBtn').onclick=()=>document.getElementById('changeUrl')?.click();
 document.getElementById('utHomeBtn').onclick=()=>{try{document.getElementById('app').contentWindow.postMessage({type:'UNITRACK_GO_HOME'},'*')}catch(_){}};
 bb.onclick=async()=>{
   if(!('Notification'in window)){alert('이 기기는 웹 알림을 지원하지 않습니다.');return}
   const r=await Notification.requestPermission();
   alert(r==='granted'?'UniTrack 알림이 허용되었습니다.':'알림 권한이 허용되지 않았습니다.');
 };
 if(f)f.addEventListener('load',()=>setTimeout(utSendUser,250));
 if(!utUser())setTimeout(()=>utOpenUser(true),350);
}
window.addEventListener('DOMContentLoaded',utInitControls);

function openApp(u){
 document.getElementById('setup').style.display='none';
 document.getElementById('changeUrl').style.display='block';
 const f=document.getElementById('app');f.style.display='block';f.src=utWithUser(u);
}
function changeConnection(){
 const current=localStorage.getItem(KEY)||'';
 const f=document.getElementById('app');f.src='about:blank';f.style.display='none';
 document.getElementById('changeUrl').style.display='none';
 document.getElementById('setup').style.display='flex';
 const input=document.getElementById('url');input.value=current;input.focus();input.select();
}
function saveAndOpen(){
 const u=document.getElementById('url').value.trim();
 if(!valid(u)){alert('Apps Script 웹앱 /exec 주소를 입력해주세요.');return}
 localStorage.setItem(KEY,u);openApp(u);
}
const saved=localStorage.getItem(KEY);
if(saved&&valid(saved))openApp(saved);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>

<script>
let pwaScanStream=null,pwaScanTimer=null,pwaScanBusy=false,pwaScanRequester=null,pwaScanRequestId='',pwaScanPort=null,pwaQuaggaTimer=null,pwaDone=false;

function sendPwaScanResult(value){
  value=String(value||'').trim();
  if(!value||pwaDone)return;
  pwaDone=true;
  try{if(navigator.vibrate)navigator.vibrate([120,55,120])}catch(_){}
  const id=pwaScanRequestId;
  // Primary v7.14.38 bridge: GET image beacon to the same Apps Script /exec.
  // Apps Script iframe polls CacheService for this requestId.
  try{
    const base=(localStorage.getItem(KEY)||'').split('?')[0];
    if(base&&id){
      const img=new Image();
      img.style.display='none';
      img.src=base+'?action=scanResult&id='+encodeURIComponent(id)+'&value='+encodeURIComponent(value)+'&_='+Date.now();
      document.body.appendChild(img);
      setTimeout(()=>{try{img.remove()}catch(_){}},4000);

      // Hidden GET navigation reliably executes Apps Script doGet even if an image MIME redirect is rejected.
      let sink=document.getElementById('unitrackScanSink');
      if(!sink){
        sink=document.createElement('iframe');
        sink.id='unitrackScanSink';sink.name='unitrackScanSink';
        sink.style.display='none';document.body.appendChild(sink);
      }
      const form=document.createElement('form');
      form.method='GET';form.action=base;form.target='unitrackScanSink';form.style.display='none';
      [['action','scanResult'],['id',id],['value',value],['_',String(Date.now())]].forEach(function(pair){
        const inp=document.createElement('input');inp.type='hidden';inp.name=pair[0];inp.value=pair[1];form.appendChild(inp);
      });
      document.body.appendChild(form);form.submit();
      setTimeout(()=>{try{form.remove()}catch(_){}},1000);
    }
  }catch(_){}
  // Keep previous direct channels as secondary fallbacks.
  const payload={type:'UNITRACK_SCAN_RESULT',value,requestId:id};
  // Direct return paths first.
  try{if(pwaScanPort){pwaScanPort.postMessage(payload);pwaScanPort.close()}}catch(_){}
  try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
  // Google can wrap the Apps Script iframe. Broadcast to every iframe we can reach.
  try{
    document.querySelectorAll('iframe').forEach(function(fr){
      try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
    });
  }catch(_){}
  // Repeat after the camera closes; this avoids losing the message during video teardown.
  setTimeout(function(){
    try{pwaScanRequester&&pwaScanRequester.postMessage(payload,'*')}catch(_){}
    try{
      document.querySelectorAll('iframe').forEach(function(fr){
        try{fr.contentWindow.postMessage(payload,'*')}catch(_){}
      });
    }catch(_){}
    closePwaScanner();
  },180);
}

async function openPwaScanner(){
  if(pwaScanBusy)return;
  pwaScanBusy=true;pwaDone=false;
  const box=document.getElementById('pwaScanner'),video=document.getElementById('pwaScanVideo');
  box.classList.add('active');
  try{
    pwaScanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},
      audio:false
    });
    try{
      const tr=pwaScanStream.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
      if(caps.focusMode&&Array.from(caps.focusMode).includes('continuous'))
        await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(_){}
    video.srcObject=pwaScanStream;
    await video.play();

    // Native detector: fast QR + common 1D.
    if('BarcodeDetector' in window){
      let formats=[];try{formats=await BarcodeDetector.getSupportedFormats()}catch(_){}
      const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
      const use=wanted.filter(x=>formats.includes(x));
      const detector=use.length?new BarcodeDetector({formats:use}):new BarcodeDetector();
      let detecting=false;
      pwaScanTimer=setInterval(async()=>{
        if(pwaDone||detecting||!pwaScanStream||video.readyState<2)return;
        detecting=true;
        try{
          const rs=await detector.detect(video);
          const hit=rs&&rs.find(x=>x&&x.rawValue);
          if(hit)sendPwaScanResult(hit.rawValue);
        }catch(_){}
        detecting=false;
      },110);
    }

    // Quagga2 in parallel for difficult 1D warehouse barcodes.
    if(window.Quagga){
      let qbusy=false;
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
      pwaQuaggaTimer=setInterval(()=>{
        if(pwaDone||qbusy||!pwaScanStream||video.readyState<2)return;
        qbusy=true;
        try{
          const vw=video.videoWidth,vh=video.videoHeight,cw=Math.round(vw*.94),ch=Math.round(vh*.34);
          c.width=1280;c.height=Math.max(360,Math.round(1280*ch/cw));
          ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
          Quagga.decodeSingle({
            src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
            inputStream:{size:1280,singleChannel:false},
            decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
            locator:{patchSize:'medium',halfSample:false}
          },r=>{qbusy=false;const v=r&&r.codeResult&&r.codeResult.code;if(v)sendPwaScanResult(v)});
        }catch(_){qbusy=false}
      },260);
    }
  }catch(e){
    closePwaScanner();
    const fb={type:'UNITRACK_SCAN_FALLBACK',requestId:pwaScanRequestId};
    try{pwaScanRequester&&pwaScanRequester.postMessage(fb,'*')}catch(_){}
  }finally{pwaScanBusy=false}
}
function closePwaScanner(){
  if(pwaScanTimer){clearInterval(pwaScanTimer);pwaScanTimer=null}
  if(pwaQuaggaTimer){clearInterval(pwaQuaggaTimer);pwaQuaggaTimer=null}
  if(pwaScanStream){pwaScanStream.getTracks().forEach(t=>t.stop());pwaScanStream=null}
  const v=document.getElementById('pwaScanVideo');if(v)v.srcObject=null;
  const box=document.getElementById('pwaScanner');if(box)box.classList.remove('active');
  pwaScanPort=null;pwaScanRequester=null;
}
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='UNITRACK_SCAN_REQUEST'){
    pwaScanRequester=ev.source;
    pwaScanRequestId=d.requestId||'';
    pwaScanPort=(ev.ports&&ev.ports[0])||null;
    try{pwaScanPort&&pwaScanPort.start&&pwaScanPort.start()}catch(_){}
    openPwaScanner();
  }
});
</script>

<script id="unitrack-pwa-scan-feedback-v71437">
(function(){
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    var t=String(d.type||'').toUpperCase();
    if((t.indexOf('SCAN')>=0 && (d.value||d.code||d.text||d.result))){
      try{ if(navigator.vibrate) navigator.vibrate([110,55,110]); }catch(_){}
    }
  },true);
})();
</script>
<script>
window.addEventListener('message',function(e){
 const d=e.data||{};
 if(d.type!=='UNITRACK_MOVEMENT_NOTIFY' && d.type!=='UNITRACK_MOVEMENT_SAVED')return;
 if(d.type==='UNITRACK_MOVEMENT_SAVED' && !d.statusChanged)return;
 if(!('Notification'in window)||Notification.permission!=='granted')return;
 const title='UniTrack 유동기록';
 const body=[
  'Unit : '+(d.unit||'-'),
  '변경상태 : '+(d.fromStatus||'-')+' → '+(d.toStatus||'-'),
  'SKT바코드 : '+(d.barcode||'-'),
  'Serial No. : '+(d.serial||'-'),
  '날짜/시간 : '+(d.date||'-'),
  '처리자 : '+(d.name||utUser()||'-')
 ].join('\n');
 try{new Notification(title,{body:body,tag:'unitrack-movement'})}catch(_){}
});
</script>
</body></html>

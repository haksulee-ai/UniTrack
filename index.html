<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d609d"><meta name="application-name" content="UniTrack"><meta name="apple-mobile-web-app-title" content="UniTrack"><meta name="apple-mobile-web-app-capable" content="yes"><title>UniTrack</title><link id="appFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%230d609d'/%3E%3Ctext x='48' y='62' text-anchor='middle' font-size='46' font-weight='bold' fill='white'%3EUT%3C/text%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#f2f4f8}#frame{width:100%;height:100%;border:0;display:block}#fallback{display:none;position:fixed;bottom:20px;left:12px;right:12px;z-index:5;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 18px #0003;text-align:center;font:14px system-ui,sans-serif;color:#333}#fallback a{display:block;background:#1768c4;color:white;padding:12px;border-radius:8px;text-decoration:none;margin-top:9px;font-weight:700}#fallback button{background:none;border:0;color:#777;padding:8px;margin-top:4px}</style></head><body><iframe id="frame" title="UniTrack 로그인 및 관리 화면" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" loading="eager"></iframe><div id="fallback">모바일 브라우저에서 로그인 확인이 계속되면, 아래 버튼으로 앱을 직접 실행해 주세요.<a id="direct" rel="noopener" target="_blank">UniTrack 직접 열기</a><button id="dismiss">안내 닫기</button></div><script>(function(){const fallback='https://script.google.com/macros/s/AKfycbzc4PizeXGRmxLZVROYWVbFdoFBbB7Xvrm7qzOYU0xA_ZPSN2NwWxuuc1S9XWJBEnnt6w/exec';const frame=document.getElementById('frame');const direct=document.getElementById('direct');const notice=document.getElementById('fallback');let appReady=false;function valid(u){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#].*)?$/.test(u)}function go(u){if(!valid(u))return;direct.href=u;if(frame.getAttribute('src')!==u)frame.setAttribute('src',u)}go(fallback);fetch('./latest-deployment.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():null).then(x=>{if(x&&valid(x.execUrl))go(x.execUrl)}).catch(()=>{});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const d=e.data||{};if(d.type==='UNITRACK_FAVICON_DATA'&&typeof d.src==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,/.test(d.src)&&d.src.length<3000000){let fav=document.getElementById('appFavicon');fav.href=d.src;fav.type='image/png'}if(d.type==='UNITRACK_APP_NAV_READY'){appReady=true;notice.style.display='none';}});setTimeout(()=>{if(!appReady)notice.style.display='block'},12000);document.getElementById('dismiss').onclick=()=>notice.style.display='none';})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d609d"><meta name="application-name" content="UniTrack"><meta name="apple-mobile-web-app-title" content="UniTrack"><meta name="apple-mobile-web-app-capable" content="yes"><title>UniTrack V140</title><link id="appFavicon" rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;background:#f2f4f8}#frame{width:100%;height:100%;border:0;display:block}#scanShell{display:none;position:fixed;inset:0;z-index:100;background:#0d1016;color:#fff;font-family:system-ui;flex-direction:column}#scanShell.active{display:flex}#scanShell video{width:100%;min-height:0;flex:1;object-fit:cover}#scanShell .scanActions{padding:10px 14px 20px;text-align:center;background:#111827}#scanShell button{padding:10px 22px;background:#fff;border:0;border-radius:9px;font-weight:750}#scanShell p{margin:6px;font-size:14px}#scanShell .nativeScanStage{position:relative;min-height:0;flex:1;overflow:hidden;background:#000}#scanShell .nativeScanStage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#scanShell .nativeScanFrame{position:absolute;left:7%;right:7%;top:32%;height:30%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.30);overflow:hidden;pointer-events:none}#scanShell .nativeScanLaser{position:absolute;left:3%;right:3%;top:8%;height:2px;background:#ff1738;box-shadow:0 0 2px rgba(255,23,56,.55);animation:utV120SharpSweep 1.65s ease-in-out infinite alternate}@keyframes utV120SharpSweep{0%{top:8%}100%{top:90%}}</style></head><body><iframe id="frame" title="UniTrack 로그인 및 관리 화면" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" loading="eager"></iframe><div id="scanShell"><div class="nativeScanStage"><video id="nativeScanVideo" autoplay muted playsinline></video><div class="nativeScanFrame"><span class="nativeScanLaser"></span></div></div><div class="scanActions"><p id="nativeScanText">카메라를 준비하는 중...</p><button id="nativeScanClose" type="button">닫기</button></div></div><script>
(function(){
 'use strict';
 const initial="https://script.google.com/macros/s/AKfycbzreqXboiYkdFEUjCf4iJSImlOOMDa3w36p5AsCtKatNKlmfnktVL8LtSII-iRupF9yvA/exec";
 const KEY='utSelectedExecUrlV130'; // previous key preserved for continuity
 const frame=document.getElementById('frame');
 const VALID=/^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec\/?$/;
 const normal=u=>String(u||'').trim().split('?')[0].replace(/\/$/,'');
 const valid=u=>VALID.test(normal(u));
 let manifest={execUrl:initial,version:'V140'};
 let override='';
 try{override=normal(localStorage.getItem(KEY));if(!valid(override))override=''}catch(_){}
 const current=()=>override||manifest.execUrl;
 function emit(type,payload,target){
   const packet=Object.assign({type},payload||{});
   if(target){try{target.postMessage(packet,'*')}catch(_){}}
   try{if(frame.contentWindow!==target)frame.contentWindow.postMessage(packet,'*')}catch(_){}
 }
 function versionInfo(target){emit('UNITRACK_VERSION_INFO',{execUrl:current(),latestExecUrl:manifest.execUrl,latestVersion:manifest.version},target)}
 function load(u){
   u=normal(u);if(!valid(u))return;
   // Force a fresh instance so Apps Script HTML state and version badge are recalculated.
   const display=u+'?ut_switch='+Date.now();
   frame.src=display;
   frame.addEventListener('load',()=>{emit('UNITRACK_EXEC_URL',{url:u});versionInfo();},{once:true});
 }
 function setTarget(u){
   u=normal(u);if(!valid(u))return false;
   const unchanged=current()===u;
   try{
     if(u===manifest.execUrl){localStorage.removeItem(KEY);override=''}
     else{localStorage.setItem(KEY,u);override=u}
   }catch(_){return false}
   if(unchanged){
     emit('UNITRACK_EXEC_URL',{url:u});
     versionInfo();
   }else load(u);
   return true;
 }
 // Always read latest-deployment.json without cache before deciding latest status.
 function readManifest(){return fetch('./latest-deployment.json?ts='+Date.now(),{cache:'no-store'})
   .then(r=>{if(!r.ok)throw Error('manifest unavailable');return r.json()})
   .then(d=>{if(d&&valid(d.execUrl)&&/^V\d+$/i.test(d.version||'')){manifest={execUrl:normal(d.execUrl),version:d.version};return true}return false}).catch(()=>false)}
 readManifest().then(()=>{load(current());versionInfo()});
 // Re-send the current and latest deployment info to delayed Apps Script sandbox frames.
 const utInfoRetry=setInterval(()=>versionInfo(),1800);
 setTimeout(()=>clearInterval(utInfoRetry),20000);
 window.addEventListener('message',async e=>{
   // Google Apps Script HTML Service can insert a nested googleusercontent sandbox iframe.
   // Direct-source equality incorrectly discarded postMessage calls from that inner frame.
   const trustedGoogleOrigin=/^https:\/\/(?:[a-z0-9-]+\.)*(?:googleusercontent\.com|google\.com)$/i.test(String(e.origin||''));
   if(e.source!==frame.contentWindow && !trustedGoogleOrigin)return;
   const d=e.data||{};
   if(d.type==='UNITRACK_VERSION_GET'){
     await readManifest();versionInfo(e.source);
   }
   if(d.type==='UNITRACK_VERSION_APPLY'){
     const u=normal(d.execUrl);
     if(!valid(u)){emit('UNITRACK_VERSION_ERROR',{message:'올바른 /exec 배포 주소가 아닙니다.'},e.source);return}
     if(current()===u){emit('UNITRACK_VERSION_UNCHANGED',{execUrl:u},e.source);versionInfo(e.source);return}
     emit('UNITRACK_VERSION_ACCEPTED',{execUrl:u},e.source);
     setTimeout(()=>{if(!setTarget(u))emit('UNITRACK_VERSION_ERROR',{message:'배포 주소를 저장하지 못했습니다.'})},180);
   }
   if(d.type==='UNITRACK_APPLY_LATEST'){
     if(!await readManifest()){emit('UNITRACK_APPLY_LATEST_RESULT',{ok:false,message:'최신 배포 정보를 불러오지 못했습니다.'},e.source);return}
     const u=manifest.execUrl;
     if(!setTarget(u)){emit('UNITRACK_APPLY_LATEST_RESULT',{ok:false,message:'최신 주소 저장에 실패했습니다.'},e.source);return}
     emit('UNITRACK_APPLY_LATEST_RESULT',{ok:true,execUrl:u},e.source);
   }
 });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script>
(function(){
 'use strict';
 const shell=document.getElementById('scanShell');
 const video=document.getElementById('nativeScanVideo');
 const msg=document.getElementById('nativeScanText');
 const appFrame=document.getElementById('frame');
 let stream=null,nativeTimer=0,quaggaTimer=0,detector=null,requestId='',requester=null,done=false,busy=false,quaggaBusy=false,generation=0;
 const APP_URL='https://script.google.com/macros/s/AKfycbzreqXboiYkdFEUjCf4iJSImlOOMDa3w36p5AsCtKatNKlmfnktVL8LtSII-iRupF9yvA/exec';
 function stop(){
   generation++;clearInterval(nativeTimer);clearInterval(quaggaTimer);
   nativeTimer=0;quaggaTimer=0;busy=false;quaggaBusy=false;
   try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}
   stream=null;video.srcObject=null;shell.classList.remove('active');
 }
 function deliver(v){
   const value=String(v||'').trim();
   if(!value||done)return;
   done=true;msg.textContent='인식 완료: '+value;
   try{navigator.vibrate&&navigator.vibrate([100,50,100])}catch(_){}
   const payload={type:'UNITRACK_SCAN_RESULT',value,requestId};
   // Respond to both the requester and the current app iframe. Repeat after teardown.
   const send=()=>{
     try{requester&&requester.postMessage(payload,'*')}catch(_){}
     try{appFrame.contentWindow&&appFrame.contentWindow.postMessage(payload,'*')}catch(_){}
   };
   send();setTimeout(send,150);setTimeout(()=>{stop();send()},300);
 }
 async function start(id,source){
   stop();requestId=id;requester=source;done=false;
   const ticket=generation;shell.classList.add('active');msg.textContent='카메라 준비 중...';
   try{
     stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false});
     if(ticket!==generation){stream.getTracks().forEach(t=>t.stop());return;}
     const track=stream.getVideoTracks()[0];
     try{const caps=track.getCapabilities?.()||{};if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
     video.srcObject=stream;await video.play();
     msg.textContent='바코드를 네모 안에 맞춰 주세요';
     if('BarcodeDetector' in window){
       try{const formats=await BarcodeDetector.getSupportedFormats();const wanted=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];const use=wanted.filter(x=>formats.includes(x));detector=use.length?new BarcodeDetector({formats:use}):new BarcodeDetector()}catch(_){try{detector=new BarcodeDetector()}catch(__){}}
       if(detector)nativeTimer=setInterval(async()=>{
         if(done||busy||!stream||video.readyState<2)return;
         busy=true;
         try{const found=await detector.detect(video);const hit=found&&found.find(x=>x&&x.rawValue);if(hit)deliver(hit.rawValue)}catch(_){}finally{busy=false}
       },110);
     }
     // V100 stable fallback: Quagga2 decodeSingle on cropped camera frames, not ZXing.
     if(window.Quagga){
       const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
       quaggaTimer=setInterval(()=>{
         if(done||quaggaBusy||!stream||video.readyState<2)return;
         const vw=video.videoWidth,vh=video.videoHeight;
         if(!vw||!vh)return;
         quaggaBusy=true;
         try{
           const cw=Math.max(1,Math.round(vw*.94)),ch=Math.max(1,Math.round(vh*.34));
           c.width=1280;c.height=Math.max(360,Math.round(1280*ch/cw));
           ctx.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
           Quagga.decodeSingle({
             src:c.toDataURL('image/jpeg',.92),numOfWorkers:0,locate:true,
             inputStream:{size:1280,singleChannel:false},
             decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader','2of5_reader','codabar_reader']},
             locator:{patchSize:'medium',halfSample:false}
           },res=>{quaggaBusy=false;const value=res&&res.codeResult&&res.codeResult.code;if(value)deliver(value)});
         }catch(_){quaggaBusy=false}
       },260);
     }
     if(!detector&&!window.Quagga)msg.textContent='바코드 인식 라이브러리를 불러오지 못했습니다.';
   }catch(e){msg.textContent='카메라 연결 실패: 권한 및 브라우저 설정을 확인해 주세요.';try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}stream=null}
 }
 document.getElementById('nativeScanClose').onclick=stop;
 window.addEventListener('message',e=>{
   const d=e.data||{};
   if(d.type!=='UNITRACK_SCAN_REQUEST'||!e.source||typeof d.requestId!=='string'||!/^g[0-9a-z]+$/i.test(d.requestId))return;
   e.source.postMessage({type:'UNITRACK_SCAN_ACK',requestId:d.requestId},'*');
   start(d.requestId,e.source);
 });
})();
</script></body></html>
